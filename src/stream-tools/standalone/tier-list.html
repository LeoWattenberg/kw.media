<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="dark">
<title>Tierlist · kw.media</title>
<link rel="icon" id="favicon" href="data:,">
<!--
  kw.media Tierlist – v0.1
  Läuft komplett lokal: keine Uploads, keine Werbung, kein Tracking.
-->
<style>
:root{--accent:#ff6900;--accent-text:#000;--accent-glow:rgba(255,105,0,.45);--link:#0096ff;--bg:#2b2b2b;--panel:#363636;--panel2:#404040;--line:#4d4d4d;--text:#fff;--muted:#b5b5b5;--font:Ubuntu,"Segoe UI",system-ui,-apple-system,Roboto,Arial,sans-serif}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--text);font:14px/1.4 var(--font);-webkit-font-smoothing:antialiased}
html.see-through,html.see-through body{background:transparent!important}
button{font:inherit;color:inherit;background:var(--panel2);border:1px solid var(--line);border-radius:9px;padding:8px 12px;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:6px;white-space:nowrap;transition:background .15s,border-color .15s}
button:hover{background:#4a4a4a;border-color:#5c5c5c}
button.primary{background:var(--accent);border-color:transparent;color:var(--accent-text);font-weight:700}
button.primary:hover{filter:brightness(1.1);background:var(--accent)}
button.ghost{background:transparent;border-color:transparent}
button.small{padding:5px 9px;font-size:12px}
.danger{color:#f87171}
kbd{display:inline-block;font:700 11px/1 var(--font);padding:3px 6px;border-radius:5px;background:#2b2b2b;border:1px solid var(--line);color:var(--muted);vertical-align:middle}
input[type=text],select,textarea{width:100%;background:var(--panel2);border:1px solid var(--line);color:var(--text);border-radius:8px;padding:8px 10px;font:inherit;outline:none}
input[type=text]:focus,select:focus,textarea:focus{border-color:var(--accent)}
textarea{resize:vertical;min-height:70px}
input[type=color]{width:34px;height:34px;padding:2px;border:1px solid var(--line);border-radius:8px;background:var(--panel2);cursor:pointer}
input[type=checkbox]{accent-color:var(--accent);width:16px;height:16px;margin:0}

/* ---------- Editor-Rahmen ---------- */
.topbar{position:sticky;top:0;z-index:20;display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 16px;background:rgba(43,43,43,.95);backdrop-filter:blur(10px);border-bottom:1px solid var(--line);flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:16px}
.brand-logo{height:32px;width:auto;display:block}
.brand-txt{border-left:1px solid var(--line);padding-left:16px}
.brand b{display:block;font-size:15px;line-height:1.1}.brand small{color:var(--muted);font-size:12px}
.actions{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.layout{display:grid;grid-template-columns:minmax(0,1fr) 330px;gap:16px;padding:16px 16px 96px;max-width:1720px;margin:0 auto}
@media (max-width:980px){.layout{grid-template-columns:1fr}}
@media (max-width:700px){.topbar{position:static}}
.stage-wrap{position:relative;width:100%;border-radius:14px;overflow:hidden;background:#1a1a1a;border:1px solid var(--line)}
.pool-panel{margin-top:14px;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:12px}
.pool-head{display:flex;align-items:center;gap:10px;margin-bottom:8px;flex-wrap:wrap}
.pool-head .hint{color:var(--muted);font-size:12px;margin-left:auto}
.pool-head #poolCount{color:var(--muted)}
.pool{display:flex;flex-wrap:wrap;gap:8px;min-height:104px;max-height:300px;overflow:auto;padding:6px;border-radius:10px;align-content:flex-start}
.pool-empty{color:var(--muted);padding:24px 12px;width:100%;text-align:center;border:2px dashed var(--line);border-radius:12px}
.side{display:flex;flex-direction:column;gap:12px;min-width:0}
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px}
.card h3{margin:0 0 12px;font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.field{display:flex;flex-direction:column;gap:5px;margin-bottom:12px}
.field>span{font-size:12px;color:var(--muted)}
.seg{display:flex;background:var(--panel2);border:1px solid var(--line);border-radius:9px;padding:3px;gap:3px}
.seg button{flex:1;border:0;background:transparent;padding:6px 8px;border-radius:7px}
.seg button.on{background:var(--accent);color:var(--accent-text);font-weight:700}
.check{display:flex;align-items:center;gap:9px;margin:8px 0;cursor:pointer;user-select:none}
.colors{display:flex;gap:16px;margin-top:10px}
.colors label{display:flex;align-items:center;gap:8px;color:var(--muted);font-size:12px}
.trow{display:grid;grid-template-columns:34px minmax(0,1fr) auto auto auto;gap:6px;align-items:center;margin-bottom:6px}
.trow button{padding:6px 9px}
.keys{display:grid;grid-template-columns:auto 1fr;gap:7px 10px;font-size:13px;color:var(--muted);align-items:center}
.keys kbd{justify-self:start}

/* Menüs */
.menu{position:relative}
.menu-pop{position:absolute;right:0;top:calc(100% + 6px);display:none;flex-direction:column;min-width:260px;max-width:calc(100vw - 24px);background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:6px;box-shadow:0 20px 50px rgba(0,0,0,.55);z-index:50}
.menu.open .menu-pop{display:flex}
.menu-pop button{background:transparent;border:0;justify-content:flex-start;padding:9px 10px;border-radius:8px;text-align:left}
.menu-pop button:hover{background:var(--panel2)}
.menu-pop small{color:var(--muted);margin-left:auto;padding-left:12px}

/* ---------- Bühne (Stage) ---------- */
.stage{position:absolute;left:0;top:0;transform-origin:0 0;overflow:hidden;font-family:var(--font);color:#fff}
.rg{position:absolute}
.cam{display:grid;place-items:center;overflow:hidden}
.cam.fill-placeholder{background:rgba(255,255,255,.035)}
.cam.fill-green{background:#00ff00}
.cam.fill-transparent{background:transparent}
body:not(.streaming) .cam.fill-transparent{background:repeating-conic-gradient(#2a2d36 0 25%,#1d1f26 0 50%) 0 0/40px 40px}
.cam-ph{display:flex;flex-direction:column;align-items:center;gap:10px;color:rgba(255,255,255,.3);font-weight:800;letter-spacing:.2em;font-size:22px}
.fill-green .cam-ph{color:rgba(0,0,0,.45)}
.cam.fill-magenta{background:#ff00ff}
.cam.fill-blue{background:#0000ff}
.fill-magenta .cam-ph,.fill-blue .cam-ph{color:rgba(255,255,255,.75)}
.cam-ring{border:4px solid var(--accent);box-shadow:0 0 34px var(--accent-glow);pointer-events:none}
.title{display:flex;align-items:center;gap:24px;overflow:hidden}
.t-logo{flex:none;object-fit:contain}
.t-text{flex:1 1 0;min-width:0;display:flex;flex-direction:column;justify-content:center}
.t-text>*{flex:none}
.t-stat{color:rgba(255,255,255,.62)}
.t-main{font-weight:800;letter-spacing:-.02em;line-height:1.05;overflow-wrap:break-word}
.t-handle{color:var(--accent);font-weight:700;margin-top:.35em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tiers{display:flex;flex-direction:column}
.tier{display:flex;border-radius:12px;overflow:hidden;flex:none}
.tlabel{flex:none;display:flex;align-items:center;justify-content:center;position:relative;font-weight:800;text-align:center;cursor:default}
.tlabel span{display:block;width:100%;padding:0 12px;line-height:1.05}
.tkey{position:absolute;left:7px;top:6px;font:800 14px/1 var(--font);opacity:.5;font-style:normal}
.titems{flex:1 1 0;min-width:0;display:flex;flex-wrap:wrap;align-content:center;align-items:center;background:rgba(255,255,255,.05);transition:background .12s}
.drop-hover.tier .titems{background:rgba(255,255,255,.13)}
.item{position:relative;flex:none;overflow:hidden;background:#222;user-select:none;-webkit-user-select:none;touch-action:none;cursor:grab;box-shadow:0 2px 8px rgba(0,0,0,.35)}
.item img{width:100%;height:100%;object-fit:cover;display:block;pointer-events:none}
.item.text{display:flex;align-items:center;justify-content:center;text-align:center;font-weight:800;color:#fff;line-height:1.08;overflow-wrap:anywhere;text-shadow:0 1px 2px rgba(0,0,0,.35)}
.item .cap{display:none;position:absolute;left:0;right:0;bottom:0;padding:16% 6% 5%;font-size:var(--cap,12px);font-weight:700;line-height:1.1;background:linear-gradient(transparent,rgba(0,0,0,.82));white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-align:center;color:#fff}
.names-on .item .cap{display:block}
.item.is-current{outline:4px solid var(--accent);outline-offset:2px;z-index:2}
.item.drag-src{opacity:.28}
.item.ghost{position:fixed;z-index:1000;pointer-events:none;opacity:.94;box-shadow:0 18px 40px rgba(0,0,0,.55);transform:rotate(-3deg) scale(1.06);outline:none}
.item.back{background:linear-gradient(135deg,var(--accent),#262626);display:grid;place-items:center;font-weight:900;color:rgba(255,255,255,.85);cursor:default}
.item.pop{animation:pop .55s cubic-bezier(.2,1.5,.4,1)}
@keyframes pop{0%{transform:scale(.35) rotate(-10deg);opacity:0}100%{transform:none;opacity:1}}
.spot{background:rgba(255,255,255,.045);border-radius:20px;display:flex;flex-direction:column;padding:22px 22px 16px}
.spot-head{display:flex;justify-content:space-between;align-items:baseline;font-size:18px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;color:var(--accent)}
.spot-head b{color:rgba(255,255,255,.5);letter-spacing:.02em;font-size:17px;text-transform:none;font-weight:700}
.spot-body{flex:1;display:flex;align-items:center;justify-content:center;min-height:0}
.spot-name{text-align:center;font-weight:800;font-size:26px;min-height:34px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.spot-name .editor-only{font-size:17px;font-weight:600;color:rgba(255,255,255,.4)}
.spot .item .cap{display:none!important}
.spot .item.is-current{outline:none;box-shadow:0 0 0 5px var(--accent),0 0 60px var(--accent-glow),0 20px 50px rgba(0,0,0,.5)}
.spot-empty{border-radius:18px;border:3px dashed rgba(255,255,255,.14);display:grid;place-items:center;color:rgba(255,255,255,.22);font-weight:900}
.spot.compact{padding:10px;border-radius:16px}
.spot.compact .spot-head{font-size:13px;justify-content:center;margin-bottom:6px}
.queue{background:rgba(255,255,255,.045);border-radius:16px;padding:12px 14px;display:flex;flex-direction:column;gap:8px;transition:background .12s}
.queue.drop-hover{background:rgba(255,255,255,.12)}
.q-head{font-size:14px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;color:rgba(255,255,255,.45);height:18px;display:flex;justify-content:space-between}
.q-items{display:flex;gap:8px;align-items:center;flex:1;min-height:0}
.q-more{display:grid;place-items:center;border-radius:12px;background:rgba(255,255,255,.07);font-weight:800;font-size:24px;color:rgba(255,255,255,.6);flex:none}
.q-empty{color:rgba(255,255,255,.4);font-weight:700;font-size:20px}
.brand-rg{display:flex;align-items:center;justify-content:flex-end;gap:1em;color:rgba(255,255,255,.45);white-space:nowrap}
.brand-rg.on-light{color:rgba(0,0,0,.55)}
.brand-rg img{display:block}
.brand-rg b{color:rgba(255,255,255,.85)}

/* Drop-Ziele & Marker */
.pool.drop-hover{outline:2px dashed var(--accent);outline-offset:-2px}
#marker{position:fixed;width:4px;background:var(--accent);border-radius:2px;pointer-events:none;z-index:999;display:none;box-shadow:0 0 12px var(--accent)}
#trash{position:fixed;right:20px;bottom:20px;padding:18px 22px;border-radius:14px;background:#2a1215;border:2px dashed #ef4444;color:#fca5a5;font-weight:700;display:none;z-index:40}
body.dragging #trash{display:block}
#trash.drop-hover{background:#ef4444;color:#fff}
body.dragging,body.dragging *{cursor:grabbing!important}

/* Schnellleiste */
#quick{position:fixed;left:12px;right:12px;bottom:16px;margin:0 auto;width:max-content;display:none;align-items:center;gap:6px;padding:8px;background:rgba(54,54,54,.97);border:1px solid var(--line);border-radius:14px;box-shadow:0 18px 50px rgba(0,0,0,.5);z-index:30;flex-wrap:wrap;max-width:calc(100% - 24px);justify-content:center}
#quick.show{display:flex}
#quick .q-lab{color:var(--muted);font-size:12px;padding:0 4px}
#quick .tierbtn{border:0;font-weight:800;max-width:120px;overflow:hidden;text-overflow:ellipsis}

/* Overlays */
#fileDrop{position:fixed;inset:0;display:none;place-items:center;background:rgba(43,43,43,.86);border:3px dashed var(--accent);font-size:28px;font-weight:800;z-index:2000;pointer-events:none}
body.filedrag #fileDrop{display:grid}
#toast{position:fixed;left:50%;top:78px;transform:translate(-50%,-10px);opacity:0;transition:opacity .2s,transform .2s;background:#404040;border:1px solid var(--line);padding:10px 16px;border-radius:10px;z-index:3000;pointer-events:none;max-width:calc(100% - 32px);text-align:center}
#toast.show{opacity:1;transform:translate(-50%,0)}
#streamHint{position:fixed;top:12px;right:12px;display:none;background:rgba(54,54,54,.94);border:1px solid var(--line);border-radius:10px;padding:8px 12px;font-size:13px;color:var(--muted);z-index:50}
dialog{background:var(--panel);color:var(--text);border:1px solid var(--line);border-radius:16px;max-width:640px;width:calc(100% - 32px);padding:22px 24px}
dialog::backdrop{background:rgba(0,0,0,.6)}
dialog h2{margin:0 0 6px;font-size:20px}
dialog h4{margin:18px 0 6px}
dialog ol{padding-left:20px;margin:6px 0}
dialog li{margin-bottom:8px}
dialog p,dialog li{color:#c9ccd6}
.dlg-foot{display:flex;justify-content:flex-end;margin-top:14px}

/* Chat-Voting */
[hidden]{display:none!important}
body.streaming .stage:not(.voting) .tkey{display:none}
.voting .tkey{opacity:.8;font-size:20px;left:9px;top:8px}
.vpct{position:absolute;right:9px;top:8px;font:800 20px/1 var(--font);font-style:normal;display:none}
.vbar{position:absolute;left:0;right:0;bottom:0;height:10px;background:rgba(0,0,0,.14);display:none}
.vfill{display:block;height:100%;width:0;background:rgba(0,0,0,.5);transition:width .35s ease}
.voting .vpct,.voting .vbar{display:block}
.voting .tlabel{padding:26px 0 12px}
.tlabel.lead{box-shadow:inset 0 0 0 4px rgba(255,255,255,.9)}
.spot-votes{display:none;flex-direction:column;gap:8px;margin:12px 0 2px}
.voting .spot-votes{display:flex}
.sv-bar{display:flex;height:16px;border-radius:8px;overflow:hidden;background:rgba(255,255,255,.08)}
.sv-bar i{display:block;height:100%;transition:width .35s ease}
.sv-text{display:flex;justify-content:space-between;gap:10px;font-size:18px;font-weight:700;color:rgba(255,255,255,.7);white-space:nowrap}
.sv-l{color:#fff;overflow:hidden;text-overflow:ellipsis}
.spot.compact .spot-votes{margin:6px 0 0}
.spot.compact .sv-bar{height:8px}
.spot.compact .sv-text{display:none}
.chat-status{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--muted);margin:10px 0 12px}
.chat-status i{width:9px;height:9px;border-radius:50%;background:#4b5060;flex:none}
.chat-status.on i{background:#22c55e;box-shadow:0 0 8px #22c55e}
.chat-status.wait i{background:#eab308}
.chat-status.err i{background:#ef4444}
.hint-text{font-size:12px;color:var(--muted);margin:10px 0 0;line-height:1.45}
#quick .qchat{background:var(--accent);border-color:transparent;color:var(--accent-text);font-weight:700}

.cbadge{position:absolute;right:5%;top:5%;padding:.12em .42em;border-radius:.45em;font-weight:800;line-height:1.15;max-width:82%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;box-shadow:0 0 0 2px rgba(0,0,0,.35);pointer-events:none}
.logo-row{display:flex;align-items:center;gap:8px}
.logo-row img{height:34px;max-width:90px;object-fit:contain;border-radius:6px;background:var(--panel2);padding:3px}
.vid-prev{display:grid;place-items:center;background:#1a1a1a;border-radius:12px;padding:10px;margin-top:4px}
#vidCanvas{max-width:100%;max-height:40vh;border-radius:8px;display:block}
.vid-prog{height:6px;background:var(--panel2);border-radius:3px;overflow:hidden;margin-top:12px}
.vid-prog i{display:block;height:100%;width:0;background:var(--accent)}
dialog .seg button:disabled{opacity:.5;cursor:default}

.lang-btn{gap:7px}
.lang-btn small{color:var(--muted);font-size:11px;letter-spacing:.06em}

.adv{margin-top:14px;border-top:1px solid var(--line);padding-top:10px}
.adv summary{cursor:pointer;color:var(--muted);font-size:12px;list-style:none;user-select:none}
.adv summary::-webkit-details-marker{display:none}
.adv summary::before{content:'▸ '}
.adv[open] summary::before{content:'▾ '}

/* Stream-Ansicht */
body.streaming .topbar,body.streaming .side,body.streaming .pool-panel,body.streaming #quick,body.streaming #toast,body.streaming #trash{display:none!important}
body.streaming .layout{display:block;padding:0;max-width:none}
body.streaming .stage-wrap{position:fixed;inset:0;border:0;border-radius:0;height:auto!important;background:#000}
html.see-through body.streaming .stage-wrap{background:transparent}
body.streaming .editor-only{display:none!important}
body.streaming #streamHint.show{display:block}

/* Eingebettet auf kw.media */
html.embedded .topbar .brand,html.embedded #btnLang{display:none!important}
html.embedded .topbar{justify-content:flex-end}
</style>
</head>
<body>
<header class="topbar">
  <div class="brand"><img class="brand-logo" id="brandLogo" alt="kw.media"><div class="brand-txt"><b data-i18n="appName"></b><small data-i18n="tagline"></small></div></div>
  <div class="actions">
    <button id="btnAddImg" class="primary" data-i18n="addImages"></button>
    <button id="btnAddText" data-i18n="addText"></button>
    <div class="menu"><button data-menu data-i18n="menuList"></button><div class="menu-pop">
      <button data-act="resetPlace" data-i18n="resetPlace"></button>
      <button data-act="saveTpl" data-i18n="saveTpl"></button>
      <button data-act="loadTpl" data-i18n="loadTpl"></button>
      <button data-act="newList" class="danger" data-i18n="newList"></button>
    </div></div>
    <div class="menu"><button data-menu data-i18n="menuExport"></button><div class="menu-pop">
      <button data-export="1:1" data-i18n="exp11"></button>
      <button data-export="9:16" data-i18n="exp916"></button>
      <button data-export="16:9" data-i18n="exp169"></button>
      <button data-act="video" data-i18n="expVideo"></button>
    </div></div>
    <button id="btnPopup" data-i18n="popup" data-i18n-title="popupTitle"></button>
    <button id="btnStream" data-i18n="streamView"></button>
    <button id="btnLang" class="ghost lang-btn"></button>
    <button id="btnHelp" class="ghost" data-i18n-aria="help">?</button>
  </div>
</header>

<main class="layout">
  <section class="left">
    <div id="stageWrap" class="stage-wrap"><div id="stage" class="stage"></div></div>
    <div class="pool-panel">
      <div class="pool-head"><b data-i18n="pool"></b><span id="poolCount"></span><button id="btnShuffle" class="small" data-i18n="shuffle"></button><span class="hint" data-i18n="poolHint"></span></div>
      <div id="pool" class="pool" data-drop="pool"></div>
    </div>
  </section>

  <aside class="side">
    <div class="card">
      <h3 data-i18n="cardList"></h3>
      <label class="field"><span data-i18n="fTitle"></span><input type="text" data-key="title" maxlength="120"></label>
      <label class="field"><span data-i18n="fHandle"></span><input type="text" data-key="handle" maxlength="60" data-i18n-ph="handlePh"></label>
      <label class="field"><span data-i18n="tierPreset"></span>
        <select id="presetSel"><option value="" data-i18n="presetChoose"></option><option value="classic" data-i18n="presetClassic"></option><option value="meme" data-i18n="presetMeme"></option><option value="topflop" data-i18n="presetTopflop"></option></select>
      </label>
      <div id="tierList"></div>
      <button id="btnAddTier" class="small" data-i18n="addTier"></button>
    </div>

    <div class="card">
      <h3 data-i18n="cardLayout"></h3>
      <div class="field"><span data-i18n="fFormat"></span><div class="seg" data-seg="format"><button data-val="16:9">16:9</button><button data-val="9:16">9:16</button><button data-val="1:1">1:1</button></div></div>
      <div class="field"><span data-i18n="camSlots"></span><div class="seg" data-seg="cams"><button data-val="0" data-i18n="none"></button><button data-val="1">1</button><button data-val="2">2</button></div></div>
      <label class="field"><span data-i18n="camFill"></span>
        <select data-key="camFill">
          <option value="placeholder" data-i18n="fillPlaceholder"></option>
          <option value="transparent" data-i18n="fillTransparent"></option>
          <option value="magenta" data-i18n="fillMagenta"></option>
          <option value="blue" data-i18n="fillBlue"></option>
          <option value="green" data-i18n="fillGreen"></option>
        </select>
      </label>
      <label class="check"><input type="checkbox" data-key="camRing"> <span data-i18n="camRing"></span></label>
      <div class="field" style="margin-top:10px"><span data-i18n="queue"></span><div class="seg" data-seg="queue"><button data-val="show" data-i18n="qShow"></button><button data-val="hidden" data-i18n="qHidden"></button><button data-val="off" data-i18n="off"></button></div></div>

const PATH_LANG=(((QS.get('lang')||'').match(/^(de|en)$/i)||[])[1]||(/\/(de|en)(\/|$)/i.exec(location.pathname)||[])[1]||'').toLowerCase();

function defaultState(){

}

function normalize(s){
  const o=defaultState();
  if(!s||typeof s!=='object') return o;
  if(s.lang==='de'||s.lang==='en') o.lang=s.lang;
  if(typeof s.title==='string') o.title=s.title.slice(0,120);
  if(typeof s.handle==='string') o.handle=s.handle.slice(0,60);
  if(FORMATS.includes(s.format)) o.format=s.format;
  if([0,1,2].includes(s.cams)) o.cams=s.cams;
  if(FILLS.includes(s.camFill)) o.camFill=s.camFill;
  if(QUEUES.includes(s.queue)) o.queue=s.queue;
  for(const k of ['camRing','names','autoNext','brand','chatAuto','voteBang','chatBadges']) if(typeof s[k]==='boolean') o[k]=s[k];
  if(typeof s.chatChannel==='string') o.chatChannel=s.chatChannel.slice(0,40);
  if([0,15,30,60].includes(s.voteTimer)) o.voteTimer=s.voteTimer;
  if(typeof s.logo==='string'&&IMG_RE.test(s.logo)){o.logo=s.logo;o.logoAR=Math.max(.2,Math.min(6,+s.logoAR||1));}
  if(Array.isArray(s.log)) o.log=s.log.filter(e=>e&&typeof e.i==='string'&&typeof e.t==='string'&&typeof e.ts==='number').slice(-500).map(e=>({i:e.i,t:e.t,ts:e.ts}));
  if(isHex(s.bg)) o.bg=s.bg;
  if(isHex(s.accent)) o.accent=s.accent;
  const items={};
  if(s.items&&typeof s.items==='object'){
    for(const [id,it] of Object.entries(s.items)){
      if(!it||typeof it!=='object') continue;
      if(it.type==='img'&&typeof it.src==='string'&&IMG_RE.test(it.src)) items[id]={id,type:'img',src:it.src,name:String(it.name||'').slice(0,80),v:+it.v||0};
      else if(it.type==='text'&&typeof it.text==='string') items[id]={id,type:'text',text:it.text.slice(0,80),bg:isHex(it.bg)?it.bg:TEXT_COLORS[0],v:+it.v||0};
      else continue;
      const ch=it.chat; if(ch&&typeof ch==='object'&&typeof ch.t==='string') items[id].chat={t:ch.t,p:Math.round(+ch.p||0),n:Math.round(+ch.n||0)};
    }
  }
  o.items=items;
  const seen=new Set();
  const take=a=>Array.isArray(a)?a.filter(id=>typeof id==='string'&&items[id]&&!seen.has(id)&&seen.add(id)):[];
  if(Array.isArray(s.tiers)){
    const ids=new Set();
    o.tiers=s.tiers.filter(t=>t&&typeof t==='object').slice(0,20).map(t=>{
      let id=typeof t.id==='string'&&t.id?t.id:uid(); if(ids.has(id)) id=uid(); ids.add(id);
      return {id,label:String(t.label??'').slice(0,40),color:isHex(t.color)?t.color:'#888888',items:take(t.items)};
    });
  }
  o.pool=take(s.pool);
  o.current=typeof s.current==='string'&&seen.has(s.current)?s.current:null;
  return o;
}

function serialize(contentOnly){
  const ref=new Set([...state.pool,...state.tiers.flatMap(t=>t.items)]);
  const items={}; for(const id of ref) if(state.items[id]) items[id]=state.items[id];
  if(contentOnly) return {title:state.title,tiers:state.tiers,pool:state.pool,items,log:state.log};
  return {...state,items};
}

let state=(()=>{try{const raw=localStorage.getItem(KEY);if(!raw) return defaultState();const s=normalize(JSON.parse(raw));if(s.accent==='#7c5cff') s.accent=KWM_COLOR;if(s.bg==='#101117') s.bg=KWM_BG;s.lang=LANG;return s;}catch(e){return defaultState();}})();
let history=[];
const cache=new Map();

const stage=$('#stage'), wrap=$('#stageWrap'), mctx=document.createElement('canvas').getContext('2d');

/* ---------- Commit / Speicher / Sync ---------- */
let saveT=0,bcT=0;
function isPlaced(id){return state.pool.includes(id)||state.tiers.some(t=>t.items.includes(id));}
function commit(o={}){
  if(state.current&&!isPlaced(state.current)) state.current=null;
  if(state.lang!==LANG){LANG=state.lang;applyLang();}
  syncVoteRound();
  applyTheme();
  if(!o.skipSidebar) renderSidebar();
  renderStage(); renderPool(); renderQuick();
  if(isChatOwner()) pushVotes();
  if(!o.fromPeer){clearTimeout(saveT);saveT=setTimeout(saveNow,250);clearTimeout(bcT);bcT=setTimeout(broadcast,30);}
}
function saveNow(){
  try{localStorage.setItem(KEY,JSON.stringify(serialize()));}
  catch(e){if(!saveWarned){saveWarned=true;toast(i18n('tStorageFull'));}}
}
function broadcast(){
  if(!peers.size) return;
  const data={kwm:'state',state:serialize()};
  for(const p of [...peers]){try{if(p.closed){peers.delete(p);continue;}p.postMessage(data,'*');}catch(e){peers.delete(p);}}
}
function applyIncoming(s){
  if(drag) return;
  state=normalize({...s,items:{...state.items,...(s&&s.items||{})}});
  commit({fromPeer:true});
}
window.addEventListener('message',e=>{
  const d=e.data; if(!d||typeof d!=='object'||typeof d.kwm!=='string') return;
  if(d.kwm==='hello'){ if(popupRef&&e.source===popupRef){peers.add(e.source);e.source.postMessage({kwm:'state',state:serialize()},'*');} return; }
  if(!peers.has(e.source)) return;
  if(d.kwm==='state'&&d.state) applyIncoming(d.state);
  else if(d.kwm==='votes'&&d.view&&typeof d.view==='object'&&!isChatOwner()){voteView=d.view;applyVotes();}
  else if(d.kwm==='cmd'&&d.cmd==='vote-pause') toggleVotePause();
});
window.addEventListener('storage',e=>{ if(e.key!==KEY||!e.newValue) return; try{applyIncoming(JSON.parse(e.newValue));}catch(err){} });

function snap(){return JSON.stringify({tiers:state.tiers,pool:state.pool,current:state.current});}
function pushHistory(){history.push(snap());if(history.length>80) history.shift();}
function undo(){
  const s=history.pop(); if(!s){toast(i18n('tNothingUndo'));return;}
  const o=JSON.parse(s);
  state.tiers=o.tiers.map(t=>({...t,items:t.items.filter(id=>state.items[id])}));
  state.pool=o.pool.filter(id=>state.items[id]);

}

function applyTheme(){

  r.setProperty('--accent',state.accent); r.setProperty('--accent-glow',rgba(state.accent,.45)); r.setProperty('--accent-text',textOn(state.accent));

/* ---------- Item-Aktionen ---------- */
function detach(id){
  const i=state.pool.indexOf(id); if(i>=0) state.pool.splice(i,1);
  for(const t of state.tiers){const j=t.items.indexOf(id); if(j>=0) t.items.splice(j,1);}
}
function arrFor(target){ if(target==='pool') return state.pool; const t=state.tiers.find(t=>t.id===target); return t?t.items:null; }
function moveItem(id,target,beforeId){
  const arr=arrFor(target); if(!arr) return false;
  pushHistory(); detach(id);
  const idx=beforeId?arr.indexOf(beforeId):-1;
  if(idx<0) arr.push(id); else arr.splice(idx,0,id);
  return true;
}
function afterPlace(prevPoolIdx){
  state.current=null;
  if(state.autoNext&&state.pool.length) state.current=state.pool[Math.min(Math.max(prevPoolIdx,0),state.pool.length-1)];
}
function tierOf(id){const t=state.tiers.find(t=>t.items.includes(id));return t?t.id:null;}
function recordPlacement(id,tid){
  const it=state.items[id]; if(!it) return;
  const v=effView();
  if(v&&v.round===id&&v.total>0&&v.lead) it.chat={t:v.lead,p:Math.round((v.tally[v.lead]||0)*100/v.total),n:v.total};
  state.log=state.log.filter(e=>e.i!==id); state.log.push({i:id,t:tid,ts:Date.now()});
  if(state.log.length>500) state.log.shift();
}
function placeCurrent(i){
  const id=state.current;
  if(!id){toast(i18n('tPickFirst'));return;}
  const t=state.tiers[i]; if(!t) return;
  const prev=state.pool.indexOf(id), was=tierOf(id);
  pushHistory(); detach(id); t.items.push(id);
  if(was!==t.id) recordPlacement(id,t.id);
  afterPlace(prev); commit();
}
function nextItem(){
  const p=state.pool;
  if(!p.length){toast(i18n('tPoolEmpty'));return;}
  const i=state.current?p.indexOf(state.current):-1;
  state.current=p[(i+1)%p.length]; commit();
}
function currentToPool(){
  const id=state.current; if(!id) return;
  pushHistory(); detach(id); state.pool.push(id); state.current=null; commit();
}
function deleteItem(id){
  if(!id||!state.items[id]) return;
  pushHistory(); detach(id); if(state.current===id) state.current=null; commit();
  toast(i18n('tDeleted'));
}
function clickItem(id){ state.current=state.current===id?null:id; commit(); }

/* ---------- Import ---------- */
function fileToDataURL(file,max=384){
  return new Promise((res,rej)=>{
    const url=URL.createObjectURL(file); const im=new Image();
    im.onload=()=>{try{
      const w0=im.naturalWidth||max,h0=im.naturalHeight||max,k=Math.min(1,max/Math.max(w0,h0));
      const c=document.createElement('canvas'); c.width=Math.max(1,Math.round(w0*k)); c.height=Math.max(1,Math.round(h0*k));
      const g=c.getContext('2d'); g.imageSmoothingQuality='high'; g.drawImage(im,0,0,c.width,c.height);
      let out=c.toDataURL('image/webp',.88); if(!/^data:image\/webp/.test(out)) out=c.toDataURL('image/png');
      URL.revokeObjectURL(url); res(out);
    }catch(err){URL.revokeObjectURL(url);rej(err);}};
    im.onerror=()=>{URL.revokeObjectURL(url);rej(new Error('image unreadable'));};
    im.src=url;
  });
}
const cleanName=n=>n.replace(/\.[a-z0-9]+$/i,'').replace(/[_]+/g,' ').replace(/\s+/g,' ').trim().slice(0,80);
async function importImages(files){
  const imgs=[...files].filter(f=>/^image\//.test(f.type)).slice(0,300);
  if(!imgs.length) return;
  if(imgs.length>8) toast(i18n('tLoadingImgs',{n:imgs.length}));
  const added=[];
  for(const f of imgs){
    try{const src=await fileToDataURL(f);const id=uid();state.items[id]={id,type:'img',src,name:cleanName(f.name||''),v:0};added.push(id);}catch(e){}
  }
  if(!added.length){toast(i18n('tNoImgs'));return;}
  pushHistory(); state.pool.push(...added); commit();
  toast(i18n(added.length===1?'tImgs1':'tImgsN',{n:added.length}));
}
function addTexts(raw){
  const lines=raw.split(/\r?\n/).map(s=>s.trim()).filter(Boolean).slice(0,200);
  if(!lines.length) return;
  pushHistory();
  let n=Object.values(state.items).filter(i=>i.type==='text').length;
  for(const t of lines){const id=uid();state.items[id]={id,type:'text',text:t.slice(0,80),bg:TEXT_COLORS[n++%TEXT_COLORS.length],v:0};state.pool.push(id);}
  commit(); toast(i18n(lines.length===1?'tTexts1':'tTextsN',{n:lines.length}));
}
async function loadTemplateFile(f){
  try{
    const data=JSON.parse(await f.text()); const s=data&&data.state?data.state:data;
    if(!s||!Array.isArray(s.tiers)) throw new Error('kein Tierlist-Format');
    pushHistory();
    const keep=serialize();
    state=normalize({...keep,title:typeof s.title==='string'?s.title:keep.title,tiers:s.tiers,pool:s.pool,log:s.log,current:null,items:{...state.items,...(s.items||{})}});
    commit(); toast(i18n('tTplLoaded'));
  }catch(e){toast(i18n('tTplBad'));}
}
function handleFiles(files){
  const arr=[...files];
  const json=arr.find(f=>/\.json$/i.test(f.name)||f.type==='application/json');
  if(json) loadTemplateFile(json);
  if(arr.some(f=>/^image\//.test(f.type))) importImages(arr);
}
function download(blob,name){
  const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download=name;
  document.body.append(a); a.click(); a.remove(); setTimeout(()=>URL.revokeObjectURL(a.href),4000);

function computeLayout(){

  if(f==='9:16'){
    const W=1080,H=1920,P=44,cams=[];
    if(n===1) cams.push({x:0,y:0,w:1080,h:608,r:0});
    if(n===2){cams.push({x:0,y:0,w:536,h:608,r:0});cams.push({x:544,y:0,w:536,h:608,r:0});}
    let y=n?608+30:P;

/* größte Kachelgröße, bei der alle Tiers in die Fläche passen */
function layoutTiers(W,H,counts,labelW,maxS){
  const n=counts.length; if(!n) return {s:maxS,per:1,heights:[]};
  const cw=W-labelW-2*PAD; let best=null;
  for(let s=maxS;s>=16;s--){
    const per=Math.floor((cw+GAP)/(s+GAP)); if(per<1) continue;
    const need=counts.map(c=>{const l=Math.max(1,Math.ceil(c/per));return l*s+(l-1)*GAP+2*PAD;});
    best={s,per,need};
    if(need.reduce((a,b)=>a+b,0)+ROWGAP*(n-1)<=H) break;
  }
  const extra=Math.max(0,H-ROWGAP*(n-1)-best.need.reduce((a,b)=>a+b,0));
  return {s:best.s,per:best.per,heights:best.need.map(h=>h+extra/n)};
}

  if(drag.el.classList.contains('text')) g.style.fontSize=(parseFloat(drag.el.style.fontSize)||14)*k+'px';
  document.body.append(g); drag.ghost=g; drag.el.classList.add('drag-src');

/* ---------- Tastatur ---------- */
const isTyping=el=>el&&(/^(INPUT|TEXTAREA|SELECT)$/.test(el.tagName)||el.isContentEditable);
document.addEventListener('keydown',e=>{
  if(isTyping(e.target)){ if(e.key==='Enter'&&e.target.tagName==='INPUT'){ const ch=e.target.dataset.key==='chatChannel'; e.target.blur(); if(ch&&!chat.want) chatConnect(); } return; }
  if($('#help').open||$('#vidDlg').open||$('#brandDlg').open) return;
  const k=e.key;
  if((e.ctrlKey||e.metaKey)&&k.toLowerCase()==='z'){e.preventDefault();undo();return;}
  if(e.ctrlKey||e.metaKey||e.altKey) return;
  const dig=/^(?:Digit|Numpad)([0-9])$/.exec(e.code);
  if(k===' '||k==='n'||k==='N'||k==='ArrowRight'){e.preventDefault();nextItem();}
  else if(dig&&dig[1]!=='0'){e.preventDefault();placeCurrent(+dig[1]-1);}
  else if((dig&&dig[1]==='0')||k==='Backspace'){e.preventDefault();currentToPool();}
  else if(k==='Delete'){e.preventDefault();deleteItem(state.current);}
  else if(k==='f'||k==='F'){e.preventDefault();toggleStream();}
  else if(k==='Enter'){e.preventDefault();placeChatWinner();}
  else if(k==='v'||k==='V'){e.preventDefault();toggleVotePause();}
  else if(k==='?'){$('#help').showModal();}
  else if(k==='Escape'){
    const open=$$('.menu.open'); if(open.length){open.forEach(m=>m.classList.remove('open'));return;}
    if(document.body.classList.contains('streaming')&&!IS_STREAM_WIN) toggleStream(false);
    else if(state.current){state.current=null;commit();}
  }
});

  const my=++vidPrevT, P=await buildPlan(vid.fmt); if(my!==vidPrevT||rec) return;
  const cv=$('#vidCanvas'); cv.width=P.L.W; cv.height=P.L.H;

async function makeVideo(){
  if(rec){rec.cancel=true;return;}
  const info=$('#vidInfo'), bar=$('#vidBar'), go=$('#vidGo'), cv=$('#vidCanvas'), mime=pickMime();
  if(!mime||!cv.captureStream){info.textContent=i18n('vidNoRec');return;}
  const P=await buildPlan(vid.fmt), order=videoOrder(P);
  if(!order.length){info.textContent=i18n('vidNothing');return;}
  const TL=timeline(order.length,vid.len,state.chatBadges&&chatStats().n>0);
  cv.width=P.L.W; cv.height=P.L.H; const g=cv.getContext('2d');
  drawFrame(g,P,order,TL,0);
  const stream=cv.captureStream(30), mr=new MediaRecorder(stream,{mimeType:mime,videoBitsPerSecond:12e6}), chunks=[];
  mr.ondataavailable=e=>{if(e.data&&e.data.size) chunks.push(e.data);};
  rec={cancel:false,hidden:false};
  const onVis=()=>{if(document.hidden&&rec) rec.hidden=true;};
  document.addEventListener('visibilitychange',onVis);
  go.textContent=i18n('vidCancel'); go.classList.remove('primary'); setVidControls(false);
  info.textContent=i18n('vidRecording',{s:Math.round(TL.total)});
  mr.start(250);
  const t0=performance.now(); let last=-1; rec.frames=0;
  await new Promise(res=>{const step=()=>{
    if(rec.cancel) return res();
    const t=(performance.now()-t0)/1000;
    if(t-last>=1/61||t>=TL.total){drawFrame(g,P,order,TL,Math.min(t,TL.total));last=t;rec.frames++;}
    bar.style.width=Math.min(100,t/TL.total*100)+'%';
    if(t>=TL.total+.25) return res();
    requestAnimationFrame(step);
  };requestAnimationFrame(step);});
  const stopped=new Promise(r=>{mr.onstop=r;}); mr.stop(); await stopped; stream.getTracks().forEach(tr=>tr.stop());
  document.removeEventListener('visibilitychange',onVis);
  const r=rec; rec=null; go.textContent=i18n('vidCreate'); go.classList.add('primary'); setVidControls(true); bar.style.width='0';
  if(r.cancel){info.textContent=i18n('vidCancelled');renderVidPreview(true);return;}
  const ext=mime.includes('mp4')?'mp4':'webm';
  download(new Blob(chunks,{type:mime.split(';')[0]}),`${slug(state.title)}-${i18n('fileTimelapse')}-${vid.fmt.replace(':','x')}.${ext}`);
  info.textContent=i18n(ext==='webm'?'vidDoneWebm':'vidDoneMp4')+(r.hidden?i18n('vidHidden'):'');
}

/* ---------- Chat-Voting (Twitch, ohne Login) ---------- */
const IRC_URL=(()=>{const u=new URLSearchParams(location.search).get('irc');return u&&/^wss?:\/\/(127\.0\.0\.1|localhost)(:\d+)?\/?$/.test(u)?u:'wss://irc-ws.chat.twitch.tv:443';})();
const chat={ws:null,want:false,status:'off',retry:0,timer:0,joinT:0,channel:'',msg:null};
const votes={round:null,by:new Map(),ends:0};
let votePaused=false, voteView={show:false}, vt=0, lastOwner=false;
const isChatOwner=()=>!!(chat.want||chat.ws);
function effView(){const v=voteView;return v&&v.show&&state.current&&v.round===state.current?v:null;}
const cleanChannel=c=>String(c||'').trim().toLowerCase().replace(/^https?:\/\/(www\.|m\.)?twitch\.tv\//,'').replace(/^[#@]/,'').replace(/[^a-z0-9_]/g,'').slice(0,25);
function setChatStatus(st,key,params){
  chat.status=st; chat.msg=key?[key,params]:null;
  paintChatStatus(); scheduleVotesUI(true);
}
function paintChatStatus(){
  const el=$('#chatStatus'), st=chat.status;
  el.className='chat-status '+({on:'on',connecting:'wait',reconnecting:'wait',error:'err'}[st]||'');
  el.querySelector('span').textContent=chat.msg?i18n(chat.msg[0],chat.msg[1]):i18n({off:'stOff',connecting:'stConnecting',reconnecting:'stReconnecting',on:'stOn',error:'stError'}[st],{ch:chat.channel});
  const b=$('#btnChat'); b.textContent=i18n(chat.want?'disconnect':'connect'); b.classList.toggle('primary',!chat.want);
}
function chatConnect(){
  const ch=cleanChannel(state.chatChannel);
  if(!ch){toast(i18n('tEnterChannel'));return;}
  chatDisconnect(true);
  chat.channel=ch; chat.want=true; chat.retry=0;
  if(!state.chatAuto){state.chatAuto=true;commit({skipSidebar:true});}
  openSocket();
}
function chatDisconnect(silent){
  chat.want=false; clearTimeout(chat.timer); clearTimeout(chat.joinT);
  const ws=chat.ws; chat.ws=null; if(ws){try{ws.close();}catch(e){}}
  if(!silent&&state.chatAuto){state.chatAuto=false;commit({skipSidebar:true});}
  setChatStatus('off');
}
function openSocket(){
  setChatStatus(chat.retry?'reconnecting':'connecting');
  let ws; try{ws=new WebSocket(IRC_URL);}catch(e){setChatStatus('error','stImpossible');return;}
  chat.ws=ws;
  ws.onopen=()=>{
    ws.send('CAP REQ :twitch.tv/tags twitch.tv/commands'); ws.send('PASS SCHMOOPIIE');
    ws.send('NICK justinfan'+(10000+Math.floor(Math.random()*80000))); ws.send('JOIN #'+chat.channel);
    clearTimeout(chat.joinT);
    chat.joinT=setTimeout(()=>{if(chat.ws===ws&&chat.status!=='on') setChatStatus('error','stNoAnswer',{ch:chat.channel});},8000);
  };
  ws.onmessage=e=>{if(chat.ws!==ws) return; for(const line of String(e.data).split('\r\n')) if(line) onIrc(line,ws);};
  ws.onclose=()=>{
    if(chat.ws!==ws) return; chat.ws=null; clearTimeout(chat.joinT);
    if(chat.want){const d=Math.min(30000,1000*2**Math.min(chat.retry++,5));setChatStatus('reconnecting');chat.timer=setTimeout(()=>{if(chat.want) openSocket();},d);}
    else setChatStatus('off');
  };
}
function onIrc(line,ws){
  if(line.startsWith('PING')){try{ws.send('PONG'+line.slice(4));}catch(e){}return;}
  let rest=line; const tags={};
  if(rest[0]==='@'){const i=rest.indexOf(' ');for(const kv of rest.slice(1,i).split(';')){const j=kv.indexOf('=');tags[kv.slice(0,j)]=kv.slice(j+1);}rest=rest.slice(i+1);}
  const m=/^(?::(\S+) )?(\S+)(?: (.*?))?(?: :(.*))?$/.exec(rest); if(!m) return;
  const prefix=m[1]||'',cmd=m[2],trail=m[4]||'';
  if(cmd==='ROOMSTATE'||cmd==='366'||(cmd==='JOIN'&&/^justinfan/.test(prefix))){if(chat.status!=='on'){clearTimeout(chat.joinT);chat.retry=0;setChatStatus('on');}return;}
  if(cmd==='RECONNECT'){try{ws.close();}catch(e){}return;}
  if(cmd==='NOTICE'&&/fail|invalid|banned|suspend|unavailable/i.test(trail)){setChatStatus('error','raw',{s:trail.slice(0,90)});return;}
  if(cmd==='PRIVMSG') onChatMessage(tags['user-id']||prefix.split('!')[0],trail);
}
const normV=s=>String(s).toLowerCase().normalize('NFKD').replace(/[̀-ͯ]/g,'').replace(/[^a-z0-9]/g,'');
function voteKeys(){
  const first={}; for(const t of state.tiers){const f=normV(t.label)[0];if(f) first[f]=(first[f]||0)+1;}
  return state.tiers.map((t,i)=>{const n=normV(t.label),k=new Set([String(i+1)]);if(n){k.add(n);if(first[n[0]]===1) k.add(n[0]);}return k;});
}
function parseVote(text){
  let t=String(text).trim(); if(!t||t.length>30) return -1;
  if(state.voteBang&&t[0]!=='!') return -1;
  t=t.replace(/^!+/,'').replace(/^(vote|tier)\s+/i,'');
  const keys=voteKeys();
  for(const cand of [normV(t),normV(t.split(/\s+/)[0]||'')]){if(!cand) continue;const i=keys.findIndex(k=>k.has(cand));if(i>=0) return i;}
  return -1;
}
function onChatMessage(user,text){
  if(!user||!state.current||votePaused||votes.round!==state.current) return;
  if(votes.ends&&Date.now()>=votes.ends) return;
  const i=parseVote(text); if(i<0) return;
  votes.by.set(user,state.tiers[i].id); scheduleVotesUI();
}
function computeView(){
  const show=chat.status==='on'&&!!state.current, tally={}; let total=0;
  if(show) for(const tid of votes.by.values()) if(state.tiers.some(t=>t.id===tid)){tally[tid]=(tally[tid]||0)+1;total++;}
  let lead=null,max=0; for(const t of state.tiers){const n=tally[t.id]||0;if(n>max){max=n;lead=t.id;}}
  return {show,round:state.current,tally,total,lead,paused:votePaused||(!!votes.ends&&Date.now()>=votes.ends),ends:votes.ends};
}
function syncVoteRound(){
  if(!isChatOwner()) return;
  if(votes.round!==state.current){votes.round=state.current;votes.by.clear();votePaused=false;votes.ends=state.current&&state.voteTimer?Date.now()+state.voteTimer*1000:0;}
  voteView=computeView();
}
function pushVotes(){
  if(!peers.size) return; const d={kwm:'votes',view:voteView};
  for(const p of [...peers]){try{if(p.closed){peers.delete(p);continue;}p.postMessage(d,'*');}catch(e){peers.delete(p);}}
}
function scheduleVotesUI(now){
  if(vt&&!now) return;
  clearTimeout(vt);
  vt=setTimeout(()=>{
    vt=0; const own=isChatOwner();
    if(own||lastOwner){voteView=own?computeView():{show:false};pushVotes();}
    lastOwner=own; applyVotes();
  },now?0:150);
}
function applyVotes(){
  const v=effView(), show=!!v;
  if(stage.dataset.vshow!==String(show)){renderStage();return;}
  stage.classList.toggle('voting',show);
  for(const lab of $$('.tlabel',stage)){
    const n=show?(v.tally[lab.dataset.tier]||0):0, pct=show&&v.total?Math.round(n*100/v.total):0;
    const f=lab.querySelector('.vfill'); if(f) f.style.width=pct+'%';
    const pe=lab.querySelector('.vpct'); if(pe) pe.textContent=show&&v.total?pct+'%':'';
    lab.classList.toggle('lead',show&&v.total>0&&v.lead===lab.dataset.tier);
  }
  const sv=$('.spot-votes',stage);
  if(sv&&show){
    sv.querySelector('.sv-bar').replaceChildren(...state.tiers.filter(t=>v.tally[t.id]).map(t=>{const i=document.createElement('i');i.style.width=(v.tally[t.id]*100/v.total)+'%';i.style.background=t.color;return i;}));
    const lt=v.total?state.tiers.find(t=>t.id===v.lead):null;
    sv.querySelector('.sv-l').textContent=lt?i18n('chatLead',{label:lt.label,p:Math.round(v.tally[lt.id]*100/v.total)}):i18n('chatTip',{r:state.tiers.length>1?'1–'+Math.min(9,state.tiers.length):'1'});
  }
  updateCountdown(); renderQuickChat();
}
function updateCountdown(){
  const v=effView(), r=$('.sv-r',stage); if(!r||!v) return;
  let s=i18n(v.total===1?'votes1':'votesN',{n:v.total});
  if(v.paused) s+=i18n('votesEnded');
  else if(v.ends){const left=Math.max(0,Math.ceil((v.ends-Date.now())/1000));s+=` · ${Math.floor(left/60)}:${String(left%60).padStart(2,'0')}`;}
  r.textContent=s;
}
setInterval(()=>{
  const v=effView(); if(!v||!v.ends) return;
  if(isChatOwner()&&!v.paused&&Date.now()>=v.ends) scheduleVotesUI(true);
  updateCountdown();
},250);
function toggleVotePause(){
  if(!isChatOwner()){for(const p of peers){try{p.postMessage({kwm:'cmd',cmd:'vote-pause'},'*');}catch(e){}}return;}
  if(!state.current||chat.status!=='on'){toast(i18n('tNoVote'));return;}
  if(votes.ends&&Date.now()>=votes.ends){votes.ends=0;votePaused=false;}
  else votePaused=!votePaused;
  toast(i18n(votePaused?'tVoteStopped':'tVoteResumed'));
  scheduleVotesUI(true);
}
function placeChatWinner(){
  const v=effView(); if(!v||!v.total){toast(i18n(v?'tNoVotesYet':'tChatOff'));return;}
  const i=state.tiers.findIndex(t=>t.id===v.lead); if(i>=0) placeCurrent(i);
}
