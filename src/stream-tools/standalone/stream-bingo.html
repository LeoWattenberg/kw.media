<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="dark">
<title>Bingo · kw.media</title>
<link rel="icon" id="favicon" href="data:,">
<!--
  kw.media Stream-Bingo – v0.1
  Ein Datei, zwei Modi: Streamer (ohne #c= in der Adresse) und Zuschauer-Karte (#c=…).
  Läuft komplett im Browser: keine Uploads, keine Werbung, kein Tracking.
-->
<style>
:root{--accent:#ff6900;--accent-text:#000;--accent-glow:rgba(255,105,0,.45);--accent-soft:rgba(255,105,0,.28);--bg:#2b2b2b;--panel:#363636;--panel2:#404040;--line:#4d4d4d;--text:#fff;--muted:#b5b5b5;--font:Ubuntu,"Segoe UI",system-ui,-apple-system,Roboto,Arial,sans-serif}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--text);font:14px/1.4 var(--font);-webkit-font-smoothing:antialiased}
html.see-through,html.see-through body{background:transparent!important}
[hidden]{display:none!important}
button{font:inherit;color:inherit;background:var(--panel2);border:1px solid var(--line);border-radius:9px;padding:8px 12px;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:6px;white-space:nowrap;transition:background .15s,border-color .15s}
button:hover{background:#4a4a4a;border-color:#5c5c5c}
button:disabled{opacity:.5;cursor:default}
button.primary{background:var(--accent);border-color:transparent;color:var(--accent-text);font-weight:700}
button.primary:hover{filter:brightness(1.1);background:var(--accent)}
button.ghost{background:transparent;border-color:transparent}
button.small{padding:5px 9px;font-size:12px}
.danger{color:#f87171}
kbd{display:inline-block;font:700 11px/1 var(--font);padding:3px 6px;border-radius:5px;background:#2b2b2b;border:1px solid var(--line);color:var(--muted);vertical-align:middle}
input[type=text],select,textarea{width:100%;background:var(--panel2);border:1px solid var(--line);color:var(--text);border-radius:8px;padding:8px 10px;font:inherit;outline:none}
input[type=text]:focus,select:focus,textarea:focus{border-color:var(--accent)}
textarea{resize:vertical;min-height:70px}
input[type=color]{width:34px;height:34px;padding:2px;border:1px solid var(--line);border-radius:8px;background:var(--panel2);cursor:pointer}
input[type=checkbox]{accent-color:var(--accent);width:16px;height:16px;margin:0}
.muted{color:var(--muted)}

/* ---------- Editor ---------- */
.topbar{position:sticky;top:0;z-index:20;display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 16px;background:rgba(43,43,43,.95);backdrop-filter:blur(10px);border-bottom:1px solid var(--line);flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:16px}
.brand-logo{height:32px;width:auto;display:block}
.brand-txt{border-left:1px solid var(--line);padding-left:16px}
.brand b{display:block;font-size:15px;line-height:1.1}.brand small{color:var(--muted);font-size:12px}
.actions{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.layout{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:16px;padding:16px 16px 40px;max-width:1720px;margin:0 auto}
@media (max-width:980px){.layout{grid-template-columns:1fr}}
@media (max-width:700px){.topbar{position:static}}
.stage-wrap{position:relative;width:100%;border-radius:14px;overflow:hidden;background:#1a1a1a;border:1px solid var(--line)}
.panel{margin-top:14px;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:12px}
.ctl-head{display:flex;align-items:center;gap:10px;margin-bottom:10px;flex-wrap:wrap}
.ctl-head input{flex:1;min-width:180px;width:auto}
.ctl-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:6px}
.ev{justify-content:flex-start;text-align:left;white-space:normal;min-height:46px;line-height:1.2;align-items:center}
.ev i{font-style:normal;color:var(--muted);font-size:11px;min-width:18px}
.ev.hit{background:var(--accent);color:var(--accent-text);border-color:transparent;font-weight:700}
.ev.hit i{color:inherit;opacity:.6}
.ev.dim{opacity:.35}
.log{display:flex;flex-direction:column;gap:4px;margin-top:6px;font-size:13px;color:var(--muted);max-height:150px;overflow:auto}
.log .ok{color:#4ade80;font-weight:700}
.side{display:flex;flex-direction:column;gap:12px;min-width:0}
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px}
.card h3{margin:0 0 12px;font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);display:flex;justify-content:space-between;align-items:center}
.card h3 .code{letter-spacing:.08em;color:var(--accent);font-size:12px}
.field{display:flex;flex-direction:column;gap:5px;margin-bottom:12px}
.field>span{font-size:12px;color:var(--muted)}
.seg{display:flex;background:var(--panel2);border:1px solid var(--line);border-radius:9px;padding:3px;gap:3px}
.seg button{flex:1;border:0;background:transparent;padding:6px 8px;border-radius:7px}
.seg button.on{background:var(--accent);color:var(--accent-text);font-weight:700}
.check{display:flex;align-items:center;gap:9px;margin:8px 0;cursor:pointer;user-select:none}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.hint-text{font-size:12px;color:var(--muted);margin:8px 0 0;line-height:1.45}
.warn{color:#fbbf24}
.colors{display:flex;gap:16px;margin-top:10px}
.colors label{display:flex;align-items:center;gap:8px;color:var(--muted);font-size:12px}
.adv{margin-top:14px;border-top:1px solid var(--line);padding-top:10px}
.adv summary{cursor:pointer;color:var(--muted);font-size:12px;list-style:none;user-select:none}
.adv summary::-webkit-details-marker{display:none}
.adv summary::before{content:'▸ '}
.adv[open] summary::before{content:'▾ '}
.chat-status{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--muted);margin:10px 0 4px}
.chat-status i{width:9px;height:9px;border-radius:50%;background:#5c5c5c;flex:none}
.chat-status.on i{background:#22c55e;box-shadow:0 0 8px #22c55e}
.chat-status.wait i{background:#eab308}
.chat-status.err i{background:#ef4444}
.winlist{display:flex;flex-direction:column;gap:6px}
.winlist .w{display:flex;align-items:center;gap:8px}
.winlist .w b{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.minicard{display:grid;gap:3px;margin-top:10px}
.minicard div{aspect-ratio:1;border-radius:5px;background:var(--panel2);font-size:9px;line-height:1.1;display:flex;align-items:center;justify-content:center;text-align:center;padding:2px;overflow:hidden;word-break:break-word}
.minicard .hit{background:var(--accent-soft)}
.minicard .line{background:var(--accent);color:var(--accent-text);font-weight:700}
.lang-btn{gap:7px}
.lang-btn small{color:var(--muted);font-size:11px;letter-spacing:.06em}
.menu{position:relative}
.menu-pop{position:absolute;right:0;top:calc(100% + 6px);display:none;flex-direction:column;min-width:240px;max-width:calc(100vw - 24px);background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:6px;box-shadow:0 20px 50px rgba(0,0,0,.55);z-index:50}
.menu.open .menu-pop{display:flex}
.menu-pop button{background:transparent;border:0;justify-content:flex-start;padding:9px 10px;border-radius:8px;text-align:left}
.menu-pop button:hover{background:var(--panel2)}
.menu-pop small{color:var(--muted);margin-left:auto;padding-left:12px}
#toast{position:fixed;left:50%;top:78px;transform:translate(-50%,-10px);opacity:0;transition:opacity .2s,transform .2s;background:#404040;border:1px solid var(--line);padding:10px 16px;border-radius:10px;z-index:3000;pointer-events:none;max-width:calc(100% - 32px);text-align:center}
#toast.show{opacity:1;transform:translate(-50%,0)}
#streamHint{position:fixed;top:12px;right:12px;display:none;background:rgba(54,54,54,.94);border:1px solid var(--line);border-radius:10px;padding:8px 12px;font-size:13px;color:var(--muted);z-index:50}
dialog{background:var(--panel);color:var(--text);border:1px solid var(--line);border-radius:16px;max-width:640px;width:calc(100% - 32px);padding:22px 24px}
dialog::backdrop{background:rgba(0,0,0,.6)}
dialog h2{margin:0 0 6px;font-size:20px}
dialog h4{margin:18px 0 6px}
dialog ol{padding-left:20px;margin:6px 0}
dialog li{margin-bottom:8px}
dialog p,dialog li{color:#d6d6d6}
.dlg-foot{display:flex;justify-content:flex-end;gap:8px;margin-top:14px;flex-wrap:wrap}

/* ---------- Bühne ---------- */
.stage{position:absolute;left:0;top:0;transform-origin:0 0;overflow:hidden;font-family:var(--font);color:#fff}
.rg{position:absolute}
.cam{display:grid;place-items:center;overflow:hidden}
.cam.fill-placeholder{background:rgba(255,255,255,.035)}
.cam.fill-green{background:#00ff00}
.cam.fill-magenta{background:#ff00ff}
.cam.fill-blue{background:#0000ff}
.cam.fill-transparent{background:transparent}
body:not(.streaming) .cam.fill-transparent{background:repeating-conic-gradient(#3a3a3a 0 25%,#2a2a2a 0 50%) 0 0/40px 40px}
.cam-ph{display:flex;flex-direction:column;align-items:center;gap:10px;color:rgba(255,255,255,.3);font-weight:800;letter-spacing:.2em;font-size:22px}
.fill-green .cam-ph{color:rgba(0,0,0,.45)}
.fill-magenta .cam-ph,.fill-blue .cam-ph{color:rgba(255,255,255,.75)}
.cam-ring{border:4px solid var(--accent);box-shadow:0 0 34px var(--accent-glow);pointer-events:none}
.hdr{display:flex;flex-direction:column;justify-content:center;overflow:hidden;gap:.15em}
.h-title{font-weight:800;letter-spacing:-.02em;line-height:1.05}
.h-sub{color:var(--accent);font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.h-join{color:rgba(255,255,255,.72);font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.board{display:grid}
.tile{border-radius:16px;background:rgba(255,255,255,.06);display:flex;align-items:center;justify-content:center;text-align:center;font-weight:700;color:rgba(255,255,255,.82);position:relative;overflow:hidden;border:2px solid rgba(255,255,255,.05)}
.tile span{display:block;line-height:1.1;white-space:pre}
.tile.hit{background:var(--accent);color:var(--accent-text);border-color:transparent;box-shadow:0 0 28px var(--accent-glow)}
.tile.hit::after{content:'✓';position:absolute;right:.45em;top:.2em;font-weight:900;opacity:.55;font-size:.8em}
.tile.new{animation:pop .6s cubic-bezier(.2,1.5,.4,1)}
@keyframes pop{0%{transform:scale(.6);opacity:.2}100%{transform:none;opacity:1}}
.wins{background:rgba(255,255,255,.045);border-radius:20px;padding:20px 22px;display:flex;flex-direction:column;gap:10px;overflow:hidden}
.wins h4{margin:0;color:var(--accent);letter-spacing:.14em;text-transform:uppercase;font-size:22px;font-weight:800}
.wl{display:flex;flex-direction:column;gap:10px}
.wl.cols{display:grid;grid-template-columns:1fr 1fr;column-gap:24px}
.win{display:flex;align-items:center;gap:12px;font-weight:800;font-size:26px;min-width:0}
.win .rk{width:1.6em;height:1.6em;border-radius:50%;background:var(--accent);color:var(--accent-text);display:grid;place-items:center;flex:none;font-size:.8em}
.win .nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.win .tm{margin-left:auto;color:rgba(255,255,255,.45);font-weight:600;font-size:.75em;flex:none}
.wins .empty{color:rgba(255,255,255,.45);font-size:22px;font-weight:600}
.brand-rg{display:flex;align-items:center;justify-content:flex-end;gap:1em;color:rgba(255,255,255,.45);white-space:nowrap}
.brand-rg.on-light{color:rgba(0,0,0,.55)}
.brand-rg img{display:block}
.cele{position:absolute;inset:0;background:rgba(14,14,14,.94);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:22px;animation:fadein .35s ease;z-index:5}
.cele.out{animation:fadeout .5s ease forwards}
@keyframes fadein{from{opacity:0}to{opacity:1}}
@keyframes fadeout{to{opacity:0}}
.cele .big{font-weight:900;color:var(--accent);line-height:1;text-shadow:0 0 60px var(--accent-glow);animation:pop .7s cubic-bezier(.2,1.6,.4,1)}
.cele .who{font-weight:800;text-align:center;max-width:90%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mini{display:grid}
.mini .c{background:rgba(255,255,255,.08);border-radius:10px;display:flex;align-items:center;justify-content:center;text-align:center;font-weight:700;overflow:hidden;color:rgba(255,255,255,.75)}
.mini .c span{white-space:pre;line-height:1.1}
.mini .c.hit{background:var(--accent-soft);color:#fff}
.mini .c.line{background:var(--accent);color:var(--accent-text);box-shadow:0 0 24px var(--accent-glow)}
.confetti{position:absolute;left:0;top:0;pointer-events:none;z-index:6}

/* ---------- Stream-Ansicht ---------- */
body.streaming .topbar,body.streaming .side,body.streaming .panel,body.streaming #toast{display:none!important}
body.streaming .layout{display:block;padding:0;max-width:none}
body.streaming .stage-wrap{position:fixed;inset:0;border:0;border-radius:0;height:auto!important;background:#000}
html.see-through body.streaming .stage-wrap{background:transparent}
body.streaming .editor-only{display:none!important}
body.streaming #streamHint.show{display:block}

/* ---------- Zuschauer-Karte ---------- */
body.viewer .topbar,body.viewer .layout{display:none!important}
#viewer{max-width:560px;margin:0 auto;padding:14px 14px 40px}
.v-top{display:flex;align-items:center;justify-content:space-between;gap:12px}
.v-top img{height:28px}
.v-title{font-size:26px;font-weight:800;margin:18px 0 2px;line-height:1.1;letter-spacing:-.01em}
.v-sub{color:var(--muted);margin-bottom:14px}
.v-sub b{color:var(--accent)}
.v-form{display:flex;flex-direction:column;gap:10px;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:16px}
.v-card{display:grid;gap:6px;margin:6px 0 12px}
.v-cell{aspect-ratio:1;border-radius:10px;background:var(--panel2);border:1px solid var(--line);display:flex;align-items:center;justify-content:center;text-align:center;padding:3px;font-weight:700;cursor:pointer;user-select:none;-webkit-user-select:none;overflow:hidden;-webkit-tap-highlight-color:transparent}
.v-cell span{white-space:pre;line-height:1.1}
.v-cell.on{background:var(--accent);color:var(--accent-text);border-color:transparent}
.v-cell.line{box-shadow:0 0 0 3px #fff inset}
.v-cell.free{background:var(--accent-soft);color:#fff;cursor:default}
.v-banner{background:var(--accent);color:var(--accent-text);border-radius:14px;padding:14px;font-weight:800;text-align:center;font-size:17px;margin-bottom:12px;animation:pop .6s cubic-bezier(.2,1.5,.4,1)}
.v-name{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:8px;color:var(--muted)}
.v-name b{color:var(--text)}
.v-foot{display:flex;justify-content:space-between;align-items:center;margin-top:18px;color:var(--muted);font-size:12px;gap:10px;flex-wrap:wrap}
.v-foot a{color:var(--muted);display:flex;align-items:center;gap:8px;text-decoration:none}
.v-foot a img{height:18px}
.v-err{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:18px;margin-top:20px}

/* Eingebettet auf kw.media */
html.embedded .topbar .brand,html.embedded #btnLang{display:none!important}
html.embedded .topbar{justify-content:flex-end}
</style>
</head>
<body>
<header class="topbar">
  <div class="brand"><img class="brand-logo" id="brandLogo" alt="kw.media"><div class="brand-txt"><b data-i18n="appName"></b><small data-i18n="tagline"></small></div></div>
  <div class="actions">
    <div class="menu"><button data-menu data-i18n="menuExport"></button><div class="menu-pop">
      <button data-export="1:1" data-i18n="exp11"></button>
      <button data-export="9:16" data-i18n="exp916"></button>
      <button data-export="16:9" data-i18n="exp169"></button>
    </div></div>
    <button id="btnPopup" data-i18n="popup" data-i18n-title="popupTitle"></button>
    <button id="btnStream" data-i18n="streamView"></button>
    <button id="btnLang" class="ghost lang-btn"></button>
    <button id="btnHelp" class="ghost" data-i18n-aria="help">?</button>
  </div>
</header>

<main class="layout">
  <section class="left">
    <div id="stageWrap" class="stage-wrap"><div id="stage" class="stage"></div></div>
    <div class="panel">
      <div class="ctl-head"><b data-i18n="ctlTitle"></b><span id="hitCount" class="muted"></span><input id="filter" type="text" data-i18n-ph="filterPh" autocomplete="off"><button id="btnUndoHit" class="small" data-i18n="undoHit"></button></div>
      <div id="ctlGrid" class="ctl-grid"></div>
    </div>
    <div class="panel">
      <b data-i18n="checkLog"></b>
      <div id="log" class="log"></div>
    </div>
  </section>

  <aside class="side">
    <div class="card">
      <h3><span data-i18n="cardRound"></span><span class="code" id="roundCode"></span></h3>
      <label class="field"><span data-i18n="fTitle"></span><input type="text" data-key="title" maxlength="80"></label>
      <div class="field"><span data-i18n="fSize"></span><div class="seg" data-seg="size"><button data-val="3">3×3</button><button data-val="4">4×4</button><button data-val="5">5×5</button></div></div>
      <label class="check"><input type="checkbox" data-key="free"> <span data-i18n="fFree"></span></label>
      <label class="field"><span data-i18n="fItems"></span><textarea data-key="itemsText" rows="8"></textarea></label>
      <p class="hint-text" id="itemsInfo"></p>
      <p class="hint-text warn" id="draftInfo" hidden data-i18n="draftChanged"></p>
      <button id="btnNewRound" class="primary" style="margin-top:10px" data-i18n="newRound"></button>
    </div>

    <div class="card">
      <h3 data-i18n="cardLink"></h3>
      <input type="text" id="linkField" readonly>
      <div class="row" style="margin-top:8px"><button id="btnCopy" class="small primary" data-i18n="linkCopy"></button><button id="btnOpenLink" class="small" data-i18n="linkOpen"></button><span id="linkLen" class="muted" style="font-size:12px"></span></div>
      <p class="hint-text" id="linkInfo"></p>
      <label class="field" style="margin-top:10px"><span data-i18n="fJoin"></span><input type="text" data-key="join" maxlength="90" data-i18n-ph="joinPh"></label>
    </div>

    <div class="card">
      <h3 data-i18n="cardChat"></h3>
      <label class="field"><span data-i18n="twitchChannel"></span><input type="text" data-key="chatChannel" maxlength="40" data-i18n-ph="twitchPh" autocomplete="off" spellcheck="false"></label>
      <button id="btnChat" class="small primary"></button>
      <div class="chat-status" id="chatStatus"><i></i><span></span></div>
      <label class="field" style="margin-top:10px"><span data-i18n="fCmd"></span><input type="text" data-key="cmd" maxlength="20" spellcheck="false"></label>
      <p class="hint-text" id="chatHint"></p>
    </div>

    <div class="card">
      <h3 data-i18n="cardWinners"></h3>
      <div id="winList" class="winlist"></div>
      <div class="field" style="margin:14px 0 0"><span data-i18n="cardCheck"></span>
        <div class="row"><input type="text" id="checkName" data-i18n-ph="checkPh" style="flex:1;width:auto" spellcheck="false"><button id="btnCheck" class="small" data-i18n="checkBtn"></button></div>
      </div>
      <div id="checkOut"></div>
    </div>

    <div class="card">
      <h3 data-i18n="cardLayout"></h3>
      <div class="field"><span data-i18n="fFormat"></span><div class="seg" data-seg="format"><button data-val="16:9">16:9</button><button data-val="9:16">9:16</button><button data-val="1:1">1:1</button></div></div>
      <div class="field"><span data-i18n="camSlots"></span><div class="seg" data-seg="cams"><button data-val="0" data-i18n="none"></button><button data-val="1">1</button><button data-val="2">2</button></div></div>
      <label class="field"><span data-i18n="camFill"></span>
        <select data-key="camFill">
          <option value="placeholder" data-i18n="fillPlaceholder"></option>
          <option value="transparent" data-i18n="fillTransparent"></option>
          <option value="magenta" data-i18n="fillMagenta"></option>
          <option value="blue" data-i18n="fillBlue"></option>
          <option value="green" data-i18n="fillGreen"></option>
        </select>
      </label>
      <label class="check"><input type="checkbox" data-key="camRing"> <span data-i18n="camRing"></span></label>
      <div class="colors">
        <label><input type="color" data-key="bg"> <span data-i18n="bgColor"></span></label>
        <label><input type="color" data-key="accent"> <span data-i18n="accentColor"></span></label>
      </div>
      <details class="adv"><summary data-i18n="advanced"></summary>
        <label class="check"><input type="checkbox" data-key="brand"> <span data-i18n="showBrand"></span></label>
      </details>
    </div>
  </aside>
</main>

<section id="viewer" hidden></section>

<div id="toast"></div>
<div id="streamHint" data-i18n="streamHint"></div>

<dialog id="brandDlg">
  <h2 data-i18n="brandDlgTitle"></h2>
  <p data-i18n="brandDlgText"></p>
  <div class="dlg-foot"><button id="brandKeep" class="ghost" data-i18n="brandKeep"></button><button id="brandOff" data-i18n="brandOffAnyway"></button><button id="brandSub" class="primary" data-i18n="brandSub"></button></div>
</dialog>

<dialog id="help">

}

const parseItems=t=>{const seen=new Set(),out=[];for(let l of String(t||'').split(/\r?\n/)){l=l.trim().slice(0,60);const k=l.toLowerCase();if(l&&!seen.has(k)){seen.add(k);out.push(l);}if(out.length>=75) break;}return out;};

function defaultState(){
  return {lang:LANG,title:inLang(LANG,'defaultTitle'),size:5,free:true,itemsText:DEFAULT_ITEMS[LANG].join('\n'),cmd:'!bingo',join:'',round:null,hits:[],winners:[],
    format:'16:9',cams:1,camFill:'placeholder',camRing:true,brand:true,bg:KWM_BG,accent:KWM_COLOR,chatChannel:'',chatAuto:false};
}

  if([3,4,5].includes(s.size)) o.size=s.size;
  for(const k of ['free','camRing','brand','chatAuto']) if(typeof s[k]==='boolean') o[k]=s[k];
  if(FORMATS.includes(s.format)) o.format=s.format;
  if([0,1,2].includes(s.cams)) o.cams=s.cams;
  if(FILLS.includes(s.camFill)) o.camFill=s.camFill;
  if(isHex(s.bg)) o.bg=s.bg; if(isHex(s.accent)) o.accent=s.accent;
  const R=s.round;
  if(R&&typeof R==='object'&&typeof R.id==='string'&&[3,4,5].includes(R.size)&&Array.isArray(R.items)){
    const items=R.items.filter(x=>typeof x==='string').map(x=>x.slice(0,60)).slice(0,75);
    if(items.length>=needCount(R.size,!!R.free)) o.round={id:R.id.slice(0,8),size:R.size,free:!!R.free,items,ts:+R.ts||Date.now()};
  }

    o.hits=Array.isArray(s.hits)?[...new Set(s.hits.filter(i=>Number.isInteger(i)&&i>=0&&i<o.round.items.length))]:[];
    o.winners=Array.isArray(s.winners)?s.winners.filter(w=>w&&typeof w.u==='string').map(w=>({id:String(w.id||uid()),u:w.u.slice(0,40),d:String(w.d||w.u).slice(0,40),nm:String(w.nm||w.u).slice(0,40),ts:+w.ts||Date.now(),line:Array.isArray(w.line)?w.line.filter(Number.isInteger):[]})).slice(0,200):[];

/* ---------- Commit / Speichern / Sync ---------- */
function commit(o={}){
  if(state.lang!==LANG){LANG=state.lang;applyLang();}
  applyTheme();
  if(!o.skipSidebar) renderSidebar();
  renderStage(); renderControls(); renderWinnersSide(); renderLink(); renderLog();
  for(const w of state.winners) if(!seenWinners.has(w.id)){seenWinners.add(w.id);if(Date.now()-w.ts<60000) celeQueue.push(w);}
  playCele();
  if(!o.fromPeer){clearTimeout(saveT);saveT=setTimeout(saveNow,250);clearTimeout(bcT);bcT=setTimeout(broadcast,30);}
}
function saveNow(){try{localStorage.setItem(KEY,JSON.stringify(state));}catch(e){if(!saveWarned){saveWarned=true;toast(i18n('tStorageFull'));}}}

  if(d.kwm==='hello'){if(popupRef&&e.source===popupRef){peers.add(e.source);e.source.postMessage({kwm:'bingo',state},'*');}return;}

  state.round={id:roundId(),size:state.size,free:state.free,items,ts:Date.now()};
  state.hits=[]; state.winners=[]; log.length=0; commit();

}
function toggleHit(i){

/* ---------- Layout ---------- */
function computeLayout(){
  const f=state.format,n=state.cams;
  if(f==='9:16'){
    const W=1080,H=1920,P=44,cams=[];
    if(n===1) cams.push({x:0,y:0,w:1080,h:608,r:0});
    if(n===2){cams.push({x:0,y:0,w:536,h:608,r:0});cams.push({x:544,y:0,w:536,h:608,r:0});}
    let y=n?608+30:P;
    const hdr={x:P,y,w:W-2*P,h:210}; y+=210+18;
    const brand={x:P,y:H-P-28,w:W-2*P,h:28};
    const wins={x:P,y:brand.y-14-290,w:W-2*P,h:290};
    return {W,H,cams,hdr,board:{x:P,y,w:W-2*P,h:wins.y-18-y},wins,brand,titleFs:68,winCols:2};
  }
  if(f==='1:1'){
    const W=1080,H=1080,P=40,cw=320,ch=180,cams=[];
    for(let i=0;i<n;i++) cams.push({x:W-P-(i+1)*cw-i*16,y:P,w:cw,h:ch,r:16});
    const hh=n?ch:150, hdr={x:P,y:P,w:W-2*P-n*(cw+20),h:hh};
    const brand={x:P,y:H-P-26,w:W-2*P,h:26}, wins={x:P,y:brand.y-12-170,w:W-2*P,h:170}, by=P+hh+18;
    return {W,H,cams,hdr,board:{x:P,y:by,w:W-2*P,h:wins.y-16-by},wins,brand,titleFs:52,winCols:2};
  }
  const W=1920,H=1080,P=48,RW=520,CH=292,rx=W-P-RW,cams=[]; let y=P;
  for(let i=0;i<n;i++){cams.push({x:rx,y,w:RW,h:CH,r:18});y+=CH+24;}
  const brand={x:rx,y:H-P-30,w:RW,h:30}, wins={x:rx,y,w:RW,h:brand.y-16-y}, LW=rx-P-40;
  return {W,H,cams,hdr:{x:P,y:P,w:LW,h:160},board:{x:P,y:P+180,w:LW,h:H-P-(P+180)},wins,brand,titleFs:64,winCols:1};
}
function boardGrid(W,H,n,gap){
  let best=null;
  for(let cols=1;cols<=n;cols++){
    const rows=Math.ceil(n/cols), w=(W-(cols-1)*gap)/cols, h=(H-(rows-1)*gap)/rows;
    if(w<50||h<30) continue;
    const ar=w/h, score=Math.min(w,h*2.2)*(ar>3.5?.6:1)*(ar<.8?.7:1);

}

const IRC_URL=(()=>{const u=new URLSearchParams(location.search).get('irc');return u&&/^wss?:\/\/(127\.0\.0\.1|localhost)(:\d+)?\/?$/.test(u)?u:'wss://irc-ws.chat.twitch.tv:443';})();

function paintChatStatus(){

  el.querySelector('span').textContent=chat.msg?i18n(chat.msg[0],chat.msg[1]):i18n({off:'stOff',connecting:'stConnecting',reconnecting:'stReconnecting',on:'stOn',error:'stError'}[st],{ch:chat.channel});

  openSocket();
}
function chatDisconnect(silent){
  chat.want=false; clearTimeout(chat.timer); clearTimeout(chat.joinT);
  const ws=chat.ws; chat.ws=null; if(ws){try{ws.close();}catch(e){}}
  if(!silent&&state.chatAuto){state.chatAuto=false;commit({skipSidebar:true});}
  setChatStatus('off');

function openSocket(){
  setChatStatus(chat.retry?'reconnecting':'connecting');
  let ws; try{ws=new WebSocket(IRC_URL);}catch(e){setChatStatus('error','stImpossible');return;}
  chat.ws=ws;
  ws.onopen=()=>{ws.send('CAP REQ :twitch.tv/tags twitch.tv/commands');ws.send('PASS SCHMOOPIIE');ws.send('NICK justinfan'+(10000+Math.floor(Math.random()*80000)));ws.send('JOIN #'+chat.channel);
    clearTimeout(chat.joinT);chat.joinT=setTimeout(()=>{if(chat.ws===ws&&chat.status!=='on') setChatStatus('error','stNoAnswer',{ch:chat.channel});},8000);};
  ws.onmessage=e=>{if(chat.ws!==ws) return;for(const line of String(e.data).split('\r\n')) if(line) onIrc(line,ws);};
  ws.onclose=()=>{if(chat.ws!==ws) return;chat.ws=null;clearTimeout(chat.joinT);
    if(chat.want){const d=Math.min(30000,1000*2**Math.min(chat.retry++,5));setChatStatus('reconnecting');chat.timer=setTimeout(()=>{if(chat.want) openSocket();},d);}else setChatStatus('off');};
}
function onIrc(line,ws){
  if(line.startsWith('PING')){try{ws.send('PONG'+line.slice(4));}catch(e){}return;}
  let rest=line; const tags={};
  if(rest[0]==='@'){const i=rest.indexOf(' ');for(const kv of rest.slice(1,i).split(';')){const j=kv.indexOf('=');tags[kv.slice(0,j)]=kv.slice(j+1);}rest=rest.slice(i+1);}
  const m=/^(?::(\S+) )?(\S+)(?: (.*?))?(?: :(.*))?$/.exec(rest); if(!m) return;
  const prefix=m[1]||'',cmd=m[2],trail=m[4]||'';
  if(cmd==='ROOMSTATE'||cmd==='366'||(cmd==='JOIN'&&/^justinfan/.test(prefix))){if(chat.status!=='on'){clearTimeout(chat.joinT);chat.retry=0;setChatStatus('on');}return;}
  if(cmd==='RECONNECT'){try{ws.close();}catch(e){}return;}
  if(cmd==='NOTICE'&&/fail|invalid|banned|suspend|unavailable/i.test(trail)){setChatStatus('error','raw',{s:trail.slice(0,90)});return;}
  if(cmd==='PRIVMSG') onChatMessage({user:prefix.split('!')[0],name:(tags['display-name']||'').replace(/\\s/g,' '),text:trail});

/* Eingang für jede Chat-Quelle (Twitch jetzt, später z. B. YouTube über SYTH): {user, name, text} */
const lastTry=new Map();
function onChatMessage(msg){
  const t=String(msg.text||'').trim().toLowerCase(), cmd=cmdText().toLowerCase(), first=t.split(/\s+/)[0];

  if(el.type==='color'&&!isHex(el.value)) return;
  state[k]=el.value; commit({skipSidebar:true}); if(k==='itemsText'||k==='cmd') renderRoundInfo();
  if(k==='cmd') for(const x of $$('[data-i18n="help4"]')) x.innerHTML=i18n('help4',{cmd:cmdText()});
});
side.addEventListener('change',e=>{
  const el=e.target,k=el.dataset.key; if(!k) return;
  if(k==='brand'&&!el.checked&&state.brand){el.checked=true;el.blur();$('#brandDlg').showModal();return;}
  if(el.type==='checkbox'){state[k]=el.checked;commit();el.blur();}
  else if(el.tagName==='SELECT'){if(FILLS.includes(el.value)){state[k]=el.value;commit({skipSidebar:true});}el.blur();}
});
side.addEventListener('click',e=>{
  const b=e.target.closest('[data-seg] > button'); if(!b) return;
  const k=b.parentElement.dataset.seg; state[k]=(k==='cams'||k==='size')?+b.dataset.val:b.dataset.val; commit();
});
$('#btnNewRound').onclick=()=>startRound(true);
$('#btnUndoHit').onclick=()=>{if(state.hits.length){state.hits.pop();commit();}};
$('#filter').addEventListener('input',renderControls);
$('#filter').addEventListener('keydown',e=>{
  if(e.key!=='Enter') return; e.preventDefault();
  const R=state.round,q=norm(e.target.value); if(!R||!q) return;
  const i=R.items.findIndex(x=>x.toLowerCase().includes(q)); if(i>=0){e.target.value='';toggleHit(i);}
});
$('#btnCopy').onclick=async()=>{const v=$('#linkField').value;if(!v) return;try{await navigator.clipboard.writeText(v);}catch(e){const f=$('#linkField');f.select();document.execCommand('copy');}toast(i18n('tCopied'));};
$('#btnOpenLink').onclick=()=>{const v=$('#linkField').value;if(v) window.open(v,'_blank');};
$('#linkField').onclick=e=>e.target.select();
$('#btnCheck').onclick=()=>{
  const name=$('#checkName').value, out=$('#checkOut'), R=state.round; out.replaceChildren(); if(!R||!norm(name)) return;
  const r=check([name]), cells=r.ok?r.cells:cardFor(name,R), H=hitSet(), line=new Set(r.line||[]), c0=centerOf(R.size,R.free);
  const p=document.createElement('p'); p.className='hint-text'+(r.ok?'':' warn'); p.textContent=r.ok?i18n('checkWin'):i18n('checkNo',{b:r.best,s:R.size}); out.append(p);
  const mc=div('minicard'); mc.style.gridTemplateColumns=`repeat(${R.size},1fr)`;
  cells.forEach((it,pos)=>{const d=div(line.has(pos)?'line':(pos===c0||H.has(it))?'hit':'');d.textContent=it<0?i18n('freeText'):R.items[it];mc.append(d);}); out.append(mc);
  if(r.ok){
    const u=norm(name);
    if(state.winners.some(w=>w.u===u)){const s=document.createElement('p');s.className='hint-text';s.textContent=i18n('alreadyWon');out.append(s);}
    else{const b=document.createElement('button');b.className='small primary';b.style.marginTop='8px';b.textContent=i18n('addWinner');b.onclick=()=>{claim(name,name.trim().replace(/^@+/,''));out.replaceChildren();};out.append(b);}
  }
};
$('#checkName').addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();$('#btnCheck').click();}});
$('#btnChat').onclick=()=>{chat.want?chatDisconnect(false):chatConnect();};
$('[data-key=chatChannel]').addEventListener('keydown',e=>{if(e.key==='Enter'&&!chat.want){e.preventDefault();e.target.blur();chatConnect();}});
$('#btnStream').onclick=()=>toggleStream(true);
$('#btnPopup').onclick=()=>{
  const [w,h]=state.format==='16:9'?[1280,720]:state.format==='9:16'?[540,960]:[800,800];
  popupRef=window.open(location.href.split('#')[0]+'#stream','kwm_bingo_stream',`popup=yes,width=${w},height=${h}`);
  toast(i18n(popupRef?'tPopupOpen':'tPopupBlocked'));
};
$('#btnLang').onclick=()=>{
  const nl=LANG==='de'?'en':'de';
  if(state.title===inLang(LANG,'defaultTitle')) state.title=inLang(nl,'defaultTitle');
  const defOld=DEFAULT_ITEMS[LANG].join('\n');
  if(state.itemsText===defOld){
    state.itemsText=DEFAULT_ITEMS[nl].join('\n');
    if(state.round&&!state.hits.length&&!state.winners.length&&state.round.items.join('\n')===defOld){state.lang=nl;startRound(false);return;}
  }
  state.lang=nl; commit();
};
$('#btnHelp').onclick=()=>$('#help').showModal();
$('#btnHelpClose').onclick=()=>$('#help').close();
const brandOff=()=>{state.brand=false;commit();$('#brandDlg').close();};
$('#brandSub').onclick=()=>{try{window.open(KWM_SUB_URL,'_blank','noopener');}catch(e){}brandOff();};
$('#brandOff').onclick=brandOff;
$('#brandKeep').onclick=()=>$('#brandDlg').close();
const isTyping=el=>el&&(/^(INPUT|TEXTAREA|SELECT)$/.test(el.tagName)||el.isContentEditable);
document.addEventListener('keydown',e=>{
  if(isTyping(e.target)||$('#help').open||$('#brandDlg').open) return;
  if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='z'){e.preventDefault();$('#btnUndoHit').click();return;}
  if(e.ctrlKey||e.metaKey||e.altKey) return;
  if(e.key==='f'||e.key==='F'){e.preventDefault();toggleStream();}
  else if(e.key==='/'){e.preventDefault();$('#filter').focus();}
  else if(e.key==='Escape'&&document.body.classList.contains('streaming')&&!IS_STREAM_WIN) toggleStream(false);
});
let rz=0;
addEventListener('resize',()=>{cancelAnimationFrame(rz);rz=requestAnimationFrame(fitStage);});
if(window.ResizeObserver){let last=0;new ResizeObserver(()=>{const w=wrap.clientWidth;if(w!==last){last=w;requestAnimationFrame(fitStage);}}).observe(wrap);}

/* ---------- Start ---------- */
if(IS_STREAM_WIN){document.body.classList.add('streaming');}
$('#brandLogo').src=KWM_LOGO_LIGHT; $('#favicon').href=KWM_ICON;
applyLang(); applyTheme();
if(state.round) commit({fromPeer:true}); else if(!startRound(false)) commit();
if(document.fonts&&document.fonts.ready) document.fonts.ready.then(()=>renderStage());
if(IS_STREAM_WIN&&window.opener){peers.add(window.opener);try{window.opener.postMessage({kwm:'hello'},'*');}catch(e){}}
if(state.chatAuto&&state.chatChannel&&!(IS_STREAM_WIN&&window.opener)) chatConnect();
window.__kwm={get state(){return state;},get chat(){return chat.status;},cardFor:(n)=>state.round?cardFor(n,state.round):null,claim,onChatMessage,get log(){return log;}};
})();
</script>
</body>
</html>
