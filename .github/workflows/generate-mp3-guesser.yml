name: Generate daily MP3 Guesser

on:
  schedule:
    - cron: '17 2 * * *'
  workflow_dispatch:

permissions:
  contents: write

# Shared with the commit graph generator: both replace the whole `generated` branch, so
# they must never publish at the same time.
concurrency:
  group: generated-assets
  cancel-in-progress: false

jobs:
  generate:
    name: Generate game assets
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install audio tooling
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      # The generator reads the source history to avoid repeating a sound and prunes the
      # days it replaces, so it needs the previous snapshot before it runs.
      - name: Restore generated assets
        run: node scripts/generated-assets.mjs restore

      - name: Generate daily game
        run: npm run game:mp3-guesser
        env:
          FREESOUND_API_TOKEN: ${{ secrets.FREESOUND_API_TOKEN }}
          FREESOUND_OAUTH_TOKEN: ${{ secrets.FREESOUND_OAUTH_TOKEN }}

      - name: Publish generated game
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          node scripts/generated-assets.mjs publish "Update daily MP3 Guesser"
