name: Quality

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  packages: read

concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Unit, build, and browser checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci
        env:
          NODE_AUTH_TOKEN: ${{ secrets.PACKAGES_TOKEN || github.token }}

      - name: Run unit tests with coverage
        run: npm run test:coverage

      - name: Build site
        run: npm run build
        env:
          ASTRO_SITE: https://kw.media
          ASTRO_BASE: /
          PUBLIC_SOUNDSCAPER_ORIGIN: https://soundscaper.org

      - name: Install browser engines
        run: npx playwright install --with-deps chromium firefox webkit

      # The tools fetch their WebAssembly engines (ffmpeg, ImageMagick, MediaPipe, three.js)
      # from public CDNs at runtime. tests/browser/cdn-cache.mjs replays them from this
      # directory, so keeping it between runs saves well over a hundred megabytes of
      # third-party traffic per job and removes a CDN outage as a source of red builds.
      - name: Cache browser CDN payloads
        uses: actions/cache@v6
        with:
          path: .cache/browser-cdn
          key: browser-cdn-${{ runner.os }}-${{ hashFiles('src/lib/ffmpeg-runtime.ts', 'src/components/tools/**/*.astro') }}
          restore-keys: |
            browser-cdn-${{ runner.os }}-

      - name: Run complete Chromium browser tests
        run: npx playwright test --project=chromium
