name: Generate Soundscaper commit graph

on:
  schedule:
    - cron: '41 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write

# Shared with the MP3 Guesser generator: both replace the whole `generated` branch, so
# they must never publish at the same time.
concurrency:
  group: generated-assets
  cancel-in-progress: false

jobs:
  generate:
    name: Generate commit snapshot
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      # The generator reuses the line counts of commits the previous snapshot already
      # covered, so it needs that snapshot before it runs.
      - name: Restore generated assets
        run: node scripts/generated-assets.mjs restore

      - name: Generate commit snapshot
        run: npm run graph:soundscaper-commits
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish snapshot
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          node scripts/generated-assets.mjs publish "Update Soundscaper commit graph"
