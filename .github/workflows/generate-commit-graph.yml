name: Generate Soundscaper commit graph

on:
  schedule:
    - cron: '41 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: soundscaper-commit-graph
  cancel-in-progress: false

jobs:
  generate:
    name: Generate commit snapshot
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Generate commit snapshot
        run: npm run graph:soundscaper-commits
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Commit snapshot
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/data/soundscaper-commits.json

          if git diff --cached --quiet; then
            echo "No commit graph changes to commit."
          else
            git commit -m "Update Soundscaper commit graph"
            git push
          fi
