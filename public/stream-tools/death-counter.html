<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="dark">
<title>Zähler · kw.media</title>
<link rel="icon" id="favicon" href="data:,">
<!--
  kw.media Stream-Toolkit · Zähler – v0.1
  Läuft komplett lokal im Browser: keine Uploads, keine Werbung, kein Tracking.
-->
<style>
:root{--accent:#ff6900;--accent-text:#000;--accent-glow:rgba(255,105,0,.45);--accent-soft:rgba(255,105,0,.28);--bg:#2b2b2b;--panel:#363636;--panel2:#404040;--line:#4d4d4d;--text:#fff;--muted:#b5b5b5;--font:Ubuntu,"Segoe UI",system-ui,-apple-system,Roboto,Arial,sans-serif}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--text);font:14px/1.4 var(--font);-webkit-font-smoothing:antialiased}
html.see-through,html.see-through body{background:transparent!important}
[hidden]{display:none!important}
button{font:inherit;color:inherit;background:var(--panel2);border:1px solid var(--line);border-radius:9px;padding:8px 12px;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:6px;white-space:nowrap;transition:background .15s,border-color .15s}
button:hover{background:#4a4a4a;border-color:#5c5c5c}
button:disabled{opacity:.5;cursor:default}
button.primary{background:var(--accent);border-color:transparent;color:var(--accent-text);font-weight:700}
button.primary:hover{filter:brightness(1.1);background:var(--accent)}
button.ghost{background:transparent;border-color:transparent}
button.small{padding:5px 9px;font-size:12px}
button.big{padding:12px 18px;font-size:16px}
.danger{color:#f87171}
kbd{display:inline-block;font:700 11px/1 var(--font);padding:3px 6px;border-radius:5px;background:#2b2b2b;border:1px solid var(--line);color:var(--muted);vertical-align:middle}
input[type=text],input[type=number],input[type=datetime-local],input[type=time],select,textarea{width:100%;background:var(--panel2);border:1px solid var(--line);color:var(--text);border-radius:8px;padding:8px 10px;font:inherit;outline:none}
input:focus,select:focus,textarea:focus{border-color:var(--accent)}
textarea{resize:vertical;min-height:70px}
input[type=color]{width:34px;height:34px;padding:2px;border:1px solid var(--line);border-radius:8px;background:var(--panel2);cursor:pointer}
input[type=checkbox]{accent-color:var(--accent);width:16px;height:16px;margin:0}
input[type=range]{accent-color:var(--accent);width:100%}
.muted{color:var(--muted)}
.topbar{position:sticky;top:0;z-index:20;display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 16px;background:rgba(43,43,43,.95);backdrop-filter:blur(10px);border-bottom:1px solid var(--line);flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:16px}
.brand-logo{height:32px;width:auto;display:block}
.brand-txt{border-left:1px solid var(--line);padding-left:16px}
.brand b{display:block;font-size:15px;line-height:1.1}.brand small{color:var(--muted);font-size:12px}
.actions{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.layout{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:16px;padding:16px 16px 40px;max-width:1720px;margin:0 auto}
@media (max-width:980px){.layout{grid-template-columns:1fr}}
@media (max-width:700px){.topbar{position:static}}
.stage-wrap{position:relative;width:100%;border-radius:14px;overflow:hidden;background:#1a1a1a;border:1px solid var(--line)}
.stage-wrap.checker{background:repeating-conic-gradient(#333 0 25%,#262626 0 50%) 0 0/32px 32px}
.panel{margin-top:14px;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:12px}
.panel-head{display:flex;align-items:center;gap:10px;margin-bottom:10px;flex-wrap:wrap}
.side{display:flex;flex-direction:column;gap:12px;min-width:0}
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px}
.card h3{margin:0 0 12px;font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);display:flex;justify-content:space-between;align-items:center;gap:8px}
.field{display:flex;flex-direction:column;gap:5px;margin-bottom:12px}
.field>span{font-size:12px;color:var(--muted)}
.seg{display:flex;background:var(--panel2);border:1px solid var(--line);border-radius:9px;padding:3px;gap:3px}
.seg button{flex:1;border:0;background:transparent;padding:6px 8px;border-radius:7px}
.seg button.on{background:var(--accent);color:var(--accent-text);font-weight:700}
.check{display:flex;align-items:center;gap:9px;margin:8px 0;cursor:pointer;user-select:none}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.hint-text{font-size:12px;color:var(--muted);margin:8px 0 0;line-height:1.45}
.warn{color:#fbbf24}
.colors{display:flex;gap:16px;margin-top:10px;flex-wrap:wrap}
.colors label{display:flex;align-items:center;gap:8px;color:var(--muted);font-size:12px}
.adv{margin-top:14px;border-top:1px solid var(--line);padding-top:10px}
.adv summary{cursor:pointer;color:var(--muted);font-size:12px;list-style:none;user-select:none}
.adv summary::-webkit-details-marker{display:none}
.adv summary::before{content:'▸ '}
.adv[open] summary::before{content:'▾ '}
.chat-status{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--muted);margin:10px 0 4px}
.chat-status i{width:9px;height:9px;border-radius:50%;background:#5c5c5c;flex:none}
.chat-status.on i{background:#22c55e;box-shadow:0 0 8px #22c55e}
.chat-status.wait i{background:#eab308}
.chat-status.err i{background:#ef4444}
.lang-btn{gap:7px}
.lang-btn small{color:var(--muted);font-size:11px;letter-spacing:.06em}
.menu{position:relative}
.menu-pop{position:absolute;right:0;top:calc(100% + 6px);display:none;flex-direction:column;min-width:240px;max-width:calc(100vw - 24px);background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:6px;box-shadow:0 20px 50px rgba(0,0,0,.55);z-index:50}
.menu.open .menu-pop{display:flex}
.menu-pop button{background:transparent;border:0;justify-content:flex-start;padding:9px 10px;border-radius:8px;text-align:left}
.menu-pop button:hover{background:var(--panel2)}
.menu-pop small{color:var(--muted);margin-left:auto;padding-left:12px}
#toast{position:fixed;left:50%;top:78px;transform:translate(-50%,-10px);opacity:0;transition:opacity .2s,transform .2s;background:#404040;border:1px solid var(--line);padding:10px 16px;border-radius:10px;z-index:3000;pointer-events:none;max-width:calc(100% - 32px);text-align:center}
#toast.show{opacity:1;transform:translate(-50%,0)}
#streamHint{position:fixed;top:12px;right:12px;display:none;background:rgba(54,54,54,.94);border:1px solid var(--line);border-radius:10px;padding:8px 12px;font-size:13px;color:var(--muted);z-index:50}
dialog{background:var(--panel);color:var(--text);border:1px solid var(--line);border-radius:16px;max-width:640px;width:calc(100% - 32px);padding:22px 24px}
dialog::backdrop{background:rgba(0,0,0,.6)}
dialog h2{margin:0 0 6px;font-size:20px}
dialog h4{margin:18px 0 6px}
dialog ol{padding-left:20px;margin:6px 0}
dialog li{margin-bottom:8px}
dialog p,dialog li{color:#d6d6d6}
.dlg-foot{display:flex;justify-content:flex-end;gap:8px;margin-top:14px;flex-wrap:wrap}
.list{display:flex;flex-direction:column;gap:6px}
.list .li{display:flex;align-items:center;gap:8px}
.list .li b,.list .li span.t{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* Bühne */
.stage{position:absolute;left:0;top:0;transform-origin:0 0;overflow:hidden;font-family:var(--font);color:#fff}
.rg{position:absolute}
.cam{display:grid;place-items:center;overflow:hidden}
.cam.fill-placeholder{background:rgba(255,255,255,.035)}
.cam.fill-green{background:#00ff00}
.cam.fill-magenta{background:#ff00ff}
.cam.fill-blue{background:#0000ff}
.cam.fill-transparent{background:transparent}
body:not(.streaming) .cam.fill-transparent{background:repeating-conic-gradient(#3a3a3a 0 25%,#2a2a2a 0 50%) 0 0/40px 40px}
.cam-ph{display:flex;flex-direction:column;align-items:center;gap:10px;color:rgba(255,255,255,.3);font-weight:800;letter-spacing:.2em;font-size:22px}
.fill-green .cam-ph{color:rgba(0,0,0,.45)}
.fill-magenta .cam-ph,.fill-blue .cam-ph{color:rgba(255,255,255,.75)}
.cam-ring{border:4px solid var(--accent);box-shadow:0 0 34px var(--accent-glow);pointer-events:none}
.brand-rg{display:flex;align-items:center;justify-content:flex-end;gap:1em;color:rgba(255,255,255,.45);white-space:nowrap}
.brand-rg.on-light{color:rgba(0,0,0,.55)}
.brand-rg img{display:block}
.fit span{display:block;white-space:pre;line-height:1.1}
@keyframes pop{0%{transform:scale(.6);opacity:.2}100%{transform:none;opacity:1}}
@keyframes fadein{from{opacity:0}to{opacity:1}}
@keyframes fadeout{to{opacity:0}}

/* Stream-Ansicht */
body.streaming .topbar,body.streaming .side,body.streaming .panel,body.streaming #toast{display:none!important}
body.streaming .layout{display:block;padding:0;max-width:none}
body.streaming .stage-wrap{position:fixed;inset:0;border:0;border-radius:0;height:auto!important;background:#000}
html.see-through body.streaming .stage-wrap{background:transparent}
body.streaming .editor-only{display:none!important}
body.streaming #streamHint.show{display:block}

/* Eingebettet auf kw.media */
html.embedded .topbar .brand,html.embedded #btnLang{display:none!important}
html.embedded .topbar{justify-content:flex-end}

/* --- Tool --- */
/* Bühne */
.ct-card{border-radius:26px;background:var(--ct-card);border:2px solid rgba(var(--ct-fg),.07);color:rgb(var(--ct-fg));overflow:hidden}
.ct-row{display:flex;align-items:stretch}
.ct-row .ct-head{width:300px;flex:none;display:flex;align-items:center;padding:0 26px;border-right:2px solid rgba(var(--ct-fg),.06)}
.ct-title{font-weight:800;font-size:30px;line-height:1.15;overflow:hidden;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical}
.ct-row .ct-tiles{flex:1;display:flex;gap:14px;padding:18px 20px;align-items:flex-start}
.ct-row.has-brand .ct-tiles{padding-bottom:42px}
.ct-stack{display:flex;flex-direction:column}
.ct-stack .ct-head{padding:26px 28px 4px}
.ct-stack .ct-tiles{display:flex;flex-direction:column;gap:12px;padding:12px 24px}
.ct-tile{position:relative;display:flex;align-items:center;gap:18px;padding:0 22px;border-radius:18px;background:rgba(var(--ct-fg),.05);overflow:hidden;flex:none}
.ct-row .ct-info{display:flex;flex-direction:column;min-width:0;gap:4px}
.ct-stack .ct-info{flex:1;display:flex;align-items:center;justify-content:space-between;gap:16px;min-width:0}
.ct-name{font-weight:700;opacity:.65;text-transform:uppercase;letter-spacing:.08em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.ct-vrow{display:flex;align-items:baseline;gap:.3em;flex:none}
.ct-val{font-weight:800;font-variant-numeric:tabular-nums;line-height:1;transform-origin:left center}
.ct-stack .ct-val{transform-origin:right center}
.ct-val.bump{animation:ctbump .55s cubic-bezier(.2,1.6,.4,1)}
@keyframes ctbump{0%{transform:scale(1.35);color:var(--accent)}100%{transform:none}}
.ct-goal{opacity:.5;font-weight:700}
.ct-bar{position:absolute;left:0;right:0;bottom:0;height:6px;background:rgba(var(--ct-fg),.08)}
.ct-bar i{display:block;height:100%;background:var(--accent);transition:width .4s}
.ct-tile.reached{box-shadow:inset 0 0 0 3px var(--accent),0 0 30px var(--accent-glow)}
.reached .ct-val{color:var(--accent)}
.ct-float{position:absolute;right:18px;top:8px;color:var(--accent);font-weight:800;animation:ctfloat 1.2s ease-out forwards;pointer-events:none;z-index:2}
.ct-float.neg{color:#f87171}
@keyframes ctfloat{0%{opacity:0;transform:translateY(20px)}15%{opacity:1}100%{opacity:0;transform:translateY(-30px)}}
.ct-ic{line-height:1;flex:none}
.ct-timer.paused .ct-val,.ct-btimer.paused b{opacity:.5}
.ct-brand{right:22px;bottom:12px}
.ct-empty{flex:1;display:grid;place-items:center;opacity:.4;font-size:40px}
.ct-bigc{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;text-align:center;padding:30px}
.ct-bigc.reached{box-shadow:inset 0 0 0 4px var(--accent),0 0 60px var(--accent-glow)}
.ct-bhead{display:flex;align-items:center;gap:14px;font-size:40px;font-weight:700}
.ct-bhead .ct-name{font-size:inherit}
.ct-bigc .ct-val{transform-origin:center}
.ct-bgoal{width:70%;display:flex;flex-direction:column;gap:10px;align-items:center;font-size:24px;font-weight:700;opacity:.85}
.ct-bgoal .ct-bar{position:relative;width:100%;height:12px;border-radius:99px;overflow:hidden}
.ct-btimer{font-size:28px;font-weight:700;opacity:.85;display:flex;gap:12px;align-items:baseline}
.ct-btimer b{font-variant-numeric:tabular-nums}
.ct-float.big{right:auto;left:calc(50% + 160px);top:24%;font-size:60px}
/* Editor */
.ct-ctrls{display:flex;flex-direction:column;gap:8px}
.ct-ctrl{display:flex;align-items:center;gap:10px;background:var(--panel2);border:1px solid var(--line);border-radius:12px;padding:8px 10px}
.ct-ctrl.reached{border-color:var(--accent)}
.ct-lab{flex:1;display:flex;align-items:center;gap:8px;min-width:0}
.ct-lab b{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:15px}
.ct-ci{font-size:20px}
.ct-pm{width:46px;height:40px;font-size:22px;font-weight:800;padding:0}
.ct-v{min-width:90px;text-align:center;font-size:26px;font-weight:800;font-variant-numeric:tabular-nums}
.ct-g{color:var(--muted);min-width:56px}
.ct-timerctl{display:flex;align-items:center;gap:10px;margin-top:10px;background:var(--panel2);border:1px solid var(--line);border-radius:12px;padding:8px 10px}
.ct-ti{font-size:20px}
#timerVal{font-size:22px;font-variant-numeric:tabular-nums;min-width:90px}
.ct-log{display:flex;flex-direction:column;gap:4px;max-height:220px;overflow:auto}
.ct-log .it{display:grid;grid-template-columns:70px minmax(0,1fr) auto auto;gap:10px;align-items:center;background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:5px 8px}
.ct-log .it b{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ct-log small{color:var(--muted)}
.ct-edit{display:flex;flex-direction:column;gap:10px;margin-bottom:10px}
.ct-erow{display:flex;flex-direction:column;gap:5px;padding-bottom:10px;border-bottom:1px solid var(--line)}
.ct-el{display:flex;gap:6px;align-items:center}
.ct-el input.ct-eic{width:52px;flex:none;text-align:center;font-size:18px;padding:6px}
.ct-el input.ct-enm,.ct-el input.ct-ecmd{flex:1;min-width:0;width:auto}
.ct-el input.ct-egoal{width:96px;flex:none}

</style>
</head>
<body>
<header class="topbar">
  <div class="brand"><img class="brand-logo" id="brandLogo" alt="kw.media"><div class="brand-txt"><b data-i18n="appName"></b><small data-i18n="tagline"></small></div></div>
  <div class="actions">
    
    
    <button id="btnPopup" data-i18n="popup" data-i18n-title="popupTitle"></button>
    <button id="btnStream" data-i18n="streamView"></button>
    <button id="btnLang" class="ghost lang-btn"></button>
    <button id="btnHelp" class="ghost" data-i18n-aria="help">?</button>
  </div>
</header>
<main class="layout">
  <section class="left">
    <div id="stageWrap" class="stage-wrap"><div id="stage" class="stage"></div></div>
    <div class="panel">
  <div id="ctrlList" class="ct-ctrls"></div>
  <div class="ct-timerctl" id="timerCtl"><span class="ct-ti">⏱</span><b id="timerVal">0:00</b><button id="btnTimer" class="primary small"></button><button id="btnTimerReset" class="small ghost" data-i18n="timerReset"></button></div>
  <div class="panel-head" style="margin-top:12px"><b data-i18n="logTitle"></b><span style="flex:1"></span><button id="btnUndo" class="small" data-i18n="undo"></button><button id="btnZero" class="small ghost danger" data-i18n="allZero"></button></div>
  <div id="logList" class="ct-log"></div>
  <p class="hint-text" data-i18n="keysHint"></p>
</div>

  </section>
  <aside class="side">
    <div class="card">
  <h3 data-i18n="cardCounters"></h3>
  <div id="ctEdit" class="ct-edit"></div>
  <button id="btnAddCt" class="small" data-i18n="addCounter"></button>
</div>
<div class="card">
      <h3 data-i18n="cardChat"></h3>
      <label class="field"><span data-i18n="twitchChannel"></span><input type="text" data-key="chatChannel" maxlength="40" data-i18n-ph="twitchPh" autocomplete="off" spellcheck="false"></label>
      <button id="btnChat" class="small primary"></button>
      <div class="chat-status" id="chatStatus"><i></i><span></span></div>
      <div class="field" style="margin-top:12px"><span data-i18n="fWho"></span><div class="seg" data-seg="cmdWho"><button data-val="mods" data-i18n="whoMods"></button><button data-val="vip" data-i18n="whoVip"></button><button data-val="all" data-i18n="whoAll"></button></div></div>
<div class="field" id="cdRow"><span data-i18n="fCooldown"></span><div class="seg" data-seg="cooldown"><button data-val="5">5 s</button><button data-val="10">10 s</button><button data-val="30">30 s</button><button data-val="60">60 s</button></div></div>
<p class="hint-text" data-i18n="cmdHint"></p>

    </div>
<div class="card">
  <h3 data-i18n="cardTimer"></h3>
  <label class="check"><input type="checkbox" data-key="showTimer"> <span data-i18n="fShowTimer"></span></label>
  <div id="timerFields">
    <label class="field" style="margin-top:8px"><span data-i18n="fTimerName"></span><input type="text" data-key="timerName" maxlength="30" data-i18n-ph="timerDefault"></label>
    <label class="field"><span data-i18n="fTimerCmd"></span><input type="text" data-key="timerCmd" maxlength="24" spellcheck="false" autocomplete="off"></label>
  </div>
</div>
<div class="card">
  <h3 data-i18n="cardLook"></h3>
  <label class="field"><span data-i18n="fTitle"></span><input type="text" data-key="title" maxlength="60" data-i18n-ph="titlePh"></label>
  <label class="check"><input type="checkbox" data-key="showGoal"> <span data-i18n="fShowGoal"></span></label>
  <label class="field" style="margin-top:10px"><span data-i18n="fBgMode"></span>
    <select data-key="bgMode">
      <option value="card" data-i18n="bgCard"></option>
      <option value="magenta" data-i18n="bgMagenta"></option>
      <option value="full" data-i18n="bgFull"></option>
    </select>
  </label>
  <label class="field" id="focusRow"><span data-i18n="fFocus"></span><select id="focusSel"></select></label>
</div>
<div class="card">
      <h3 data-i18n="cardLayout"></h3>
      <div class="field"><span data-i18n="fFormat"></span><div class="seg" data-seg="format"><button data-val="row" data-i18n="fmtRow"></button><button data-val="stack" data-i18n="fmtStack"></button><button data-val="big" data-i18n="fmtBig"></button></div></div>
      
      
      <div class="colors">
        <label><input type="color" data-key="bg"> <span data-i18n="bgColor"></span></label>
        <label><input type="color" data-key="accent"> <span data-i18n="accentColor"></span></label>
      </div>
      <details class="adv"><summary data-i18n="advanced"></summary>
        <label class="check"><input type="checkbox" data-key="brand"> <span data-i18n="showBrand"></span></label>
      </details>
    </div>

  </aside>
</main>
<div id="toast"></div>
<div id="streamHint" data-i18n="streamHint"></div>

<dialog id="brandDlg">
  <h2 data-i18n="brandDlgTitle"></h2>
  <p data-i18n="brandDlgText"></p>
  <div class="dlg-foot"><button id="brandKeep" class="ghost" data-i18n="brandKeep"></button><button id="brandOff" data-i18n="brandOffAnyway"></button><button id="brandSub" class="primary" data-i18n="brandSub"></button></div>
</dialog>
<dialog id="help">
  <h2 data-i18n="helpTitle"></h2>
<ol>
  <li data-i18n="help1"></li>
  <li data-i18n="help2"></li>
  <li data-i18n="help3"></li>
  <li data-i18n="help4"></li>
</ol>

  <h4 data-i18n="helpObsH"></h4>
  <p data-i18n="helpObs"></p>
  <div class="dlg-foot"><button class="primary" id="btnHelpClose" data-i18n="gotIt"></button></div>
</dialog>
<script>
(()=>{
'use strict';
const TOOL={key:'kwm-counter-v1',msg:'kwm-counter',streamTitle:'Zähler · Stream',formats:['row','stack','big'],hasCams:false,numKeys:['cooldown'],previewH:.5,
  popupSize:s=>s.format==='stack'?[420,560]:s.format==='big'?[720,420]:[1200,170]};
const TOOL_I18N={
de:{
  pageTitle:'Zähler · kw.media', appName:'Tod- &amp; Challenge-Zähler',
  fmtRow:'Leiste', fmtStack:'Liste', fmtBig:'Groß',

function tokens(text){const out=[];for(const w of String(text).split(/\s+/).filter(Boolean)) w.replace(/-/g,'-\u0000').split('\u0000').filter(Boolean).forEach((t,i)=>out.push({t,sp:i===0}));return out;}
function wrapText(g,text,maxW,noBreak){
  const lines=[]; let cur='';
  for(const {t,sp} of tokens(text)){
    const cand=cur?cur+(sp?' ':'')+t:t;
    if(g.measureText(cand).width<=maxW){cur=cand;continue;}
    if(cur) lines.push(cur);
    if(!noBreak&&g.measureText(t).width>maxW){let part='';for(const ch of t){if(part&&g.measureText(part+ch+'-').width>maxW){lines.push(part+'-');part=ch;}else part+=ch;}cur=part;}
    else cur=t;
  }
  if(cur) lines.push(cur);
  return lines.length?lines:[''];
}
function fitBlock(g,text,maxW,maxH,start,weight=700,lh=1.1,maxLines=4,minFs=9){
  start=Math.max(minFs,Math.floor(start)); let single=null, multi=null;
  for(let fs=start;fs>=minFs;fs--){g.font=`${weight} ${fs}px ${FONT}`;if(g.measureText(text).width<=maxW&&fs*lh<=maxH){single={fs,lines:[text]};break;}}
  for(let fs=start;fs>=minFs;fs--){g.font=`${weight} ${fs}px ${FONT}`;const l=wrapText(g,text,maxW,true);if(l.length<=maxLines&&l.every(x=>g.measureText(x).width<=maxW)&&l.length*fs*lh<=maxH){multi={fs,lines:l};break;}}
  if(single&&(!multi||single.fs>=multi.fs*.85)) return single;
  if(multi) return multi;
  g.font=`${weight} ${minFs}px ${FONT}`; return {fs:minFs,lines:wrapText(g,text,maxW)};
}
function capFor(texts,w,h,start,weight=700,lh=1.1,maxLines=4){const f=texts.map(t=>fitBlock(mctx,t,w,h,start,weight,lh,maxLines).fs).sort((a,b)=>a-b);return f.length?f[Math.floor(f.length*.35)]:start;}
function fitInto(e,text,w,h,start,weight=700,lh=1.1,maxLines=4){
  const fb=fitBlock(mctx,text,w,h,start,weight,lh,maxLines);

  sp.textContent=fb.lines.join('\n'); e.style.fontSize=fb.fs+'px'; return fb;
}
function ellipsize(g,t,w){if(g.measureText(t).width<=w) return t;while(t&&g.measureText(t+'…').width>w) t=t.slice(0,-1);return t+'…';}

const IRC_URL=(()=>{const u=new URLSearchParams(location.search).get('irc');return u&&/^wss?:\/\/(127\.0\.0\.1|localhost)(:\d+)?\/?$/.test(u)?u:'wss://irc-ws.chat.twitch.tv:443';})();

function chatDisconnect(silent){

function openSocket(){
  setChatStatus(chat.retry?'reconnecting':'connecting');
  let ws; try{ws=new WebSocket(IRC_URL);}catch(e){setChatStatus('error','stImpossible');return;}
  chat.ws=ws;
  ws.onopen=()=>{ws.send('CAP REQ :twitch.tv/tags twitch.tv/commands');ws.send('PASS SCHMOOPIIE');ws.send('NICK justinfan'+(10000+Math.floor(Math.random()*80000)));ws.send('JOIN #'+chat.channel);
    clearTimeout(chat.joinT);chat.joinT=setTimeout(()=>{if(chat.ws===ws&&chat.status!=='on') setChatStatus('error','stNoAnswer',{ch:chat.channel});},8000);};
  ws.onmessage=e=>{if(chat.ws!==ws) return;for(const line of String(e.data).split('\r\n')) if(line) onIrc(line,ws);};
  ws.onclose=()=>{if(chat.ws!==ws) return;chat.ws=null;clearTimeout(chat.joinT);
    if(chat.want){const d=Math.min(30000,1000*2**Math.min(chat.retry++,5));setChatStatus('reconnecting');chat.timer=setTimeout(()=>{if(chat.want) openSocket();},d);}else setChatStatus('off');};
}
function onIrc(line,ws){
  if(line.startsWith('PING')){try{ws.send('PONG'+line.slice(4));}catch(e){}return;}
  let rest=line; const tags={};
  if(rest[0]==='@'){const i=rest.indexOf(' ');for(const kv of rest.slice(1,i).split(';')){const j=kv.indexOf('=');tags[kv.slice(0,j)]=kv.slice(j+1);}rest=rest.slice(i+1);}
  const m=/^(?::(\S+) )?(\S+)(?: (.*?))?(?: :(.*))?$/.exec(rest); if(!m) return;
  const prefix=m[1]||'',cmd=m[2],trail=m[4]||'';
  if(cmd==='ROOMSTATE'||cmd==='366'||(cmd==='JOIN'&&/^justinfan/.test(prefix))){if(chat.status!=='on'){clearTimeout(chat.joinT);chat.retry=0;setChatStatus('on');}return;}
  if(cmd==='RECONNECT'){try{ws.close();}catch(e){}return;}
  if((cmd==='CLEARCHAT'||cmd==='CLEARMSG')&&typeof onChatClear==='function'){onChatClear({id:cmd==='CLEARMSG'?(tags['target-msg-id']||''):'',user:cmd==='CLEARCHAT'?trail.trim().toLowerCase():'',all:cmd==='CLEARCHAT'&&!trail.trim()});return;}
  if(cmd==='NOTICE'&&/fail|invalid|banned|suspend|unavailable/i.test(trail)){setChatStatus('error','raw',{s:trail.slice(0,90)});return;}
  if(cmd==='PRIVMSG'&&typeof onChatMessage==='function'){
    const badges=tags.badges||'';
    onChatMessage({user:prefix.split('!')[0],name:(tags['display-name']||'').replace(/\\s/g,' ')||prefix.split('!')[0],text:trail,mod:/(^|,)(moderator|broadcaster)\//.test(badges),broadcaster:/(^|,)broadcaster\//.test(badges),sub:/(^|,)(subscriber|founder)\//.test(badges),vip:/(^|,)vip\//.test(badges),color:/^#[0-9a-f]{6}$/i.test(tags.color||'')?tags.color:'',emotes:tags.emotes||'',id:tags.id||'',source:'twitch'});
  }
}

  for(const k of ['timerName','timerCmd','title']) if(typeof s[k]==='string') o[k]=s[k].slice(0,60);
  const t=s.timer; if(t&&typeof t==='object') o.timer={run:!!t.run,start:+t.start||0,acc:Math.max(0,+t.acc||0)};

  const d=defCounters(from); state.counters.forEach((c,i)=>{if(d[i]&&c.id===d[i].id){const n=defCounters(to)[i];if(c.name===d[i].name) c.name=n.name;if(c.cmd===d[i].cmd) c.cmd=n.cmd;}});
}
const seeThrough=()=>state.bgMode==='card';
const ctById=id=>state.counters.find(c=>c.id===id);
const nameOf=c=>c.name.trim()||'#'+(state.counters.indexOf(c)+1);
const elapsed=()=>state.timer.acc+(state.timer.run?Math.max(0,Date.now()-state.timer.start):0);
function fmtTime(ms){const s=Math.floor(ms/1000),h=Math.floor(s/3600),m=Math.floor(s%3600/60);return (h?h+':'+pad2(m):m)+':'+pad2(s%60);}
const fmtNum=v=>v.toLocaleString(LANG==='de'?'de-DE':'en-US');

/* ---------- Ändern ---------- */
function change(id,to,by){
  const c=ctById(id); if(!c) return;
  to=Math.max(VMIN,Math.min(VMAX,Math.round(to))); if(to===c.value) return;
  state.log.unshift({id,from:c.value,to,t:Date.now(),by:by||''}); state.log=state.log.slice(0,50);
  c.value=to; commit({skipSidebar:true});
}
const bump=(id,d)=>{const c=ctById(id);if(c) change(id,c.value+d,'');};
function undo(){
  const l=state.log.shift(); if(!l){return;}
  const c=ctById(l.id); if(c){c.value=l.from;toast(i18n('tUndone',{n:nameOf(c),v:fmtNum(l.from)}));}
  commit({skipSidebar:true});
}
function timerToggle(on){
  const t=state.timer, run=on===undefined?!t.run:on; if(run===t.run) return;
  if(run){t.start=Date.now();t.run=true;}else{t.acc+=Math.max(0,Date.now()-t.start);t.run=false;}
  commit({skipSidebar:true});
}
function timerReset(){state.timer={run:false,start:0,acc:0};commit({skipSidebar:true});}

/* ---------- Chat ---------- */
const lastAll=new Map();
function onChatMessage(m){
  if(!state) return;
  const parts=String(m.text||'').trim().split(/\s+/), c0=(parts[0]||'').toLowerCase(), arg=(parts[1]||'').toLowerCase();
  if(!c0) return;
  const staff=m.broadcaster||m.mod, allowed=staff||(state.cmdWho==='vip'&&m.vip)||state.cmdWho==='all'||(state.cmdWho==='vip'&&staff);
  if(!allowed) return;
  const who=String(m.name||m.user).slice(0,30);
  if(state.showTimer&&c0===cleanCmd(state.timerCmd)){
    if(!staff&&!m.vip) return;
    if(arg==='start'||arg==='go') timerToggle(true);
    else if(arg==='stop'||arg==='pause') timerToggle(false);
    else if(arg==='reset'&&staff) timerReset();
    else if(!arg) timerToggle();
    return;
  }
  const c=state.counters.find(x=>cleanCmd(x.cmd)&&cleanCmd(x.cmd)===c0); if(!c) return;
  const full=staff||(state.cmdWho!=='all'&&m.vip);
  if(!full){
    if(arg&&arg!=='+') return;
    const now=Date.now(), last=lastAll.get(c.id)||0; if(now-last<state.cooldown*1000) return; lastAll.set(c.id,now);
    change(c.id,c.value+1,who); return;
  }
  let to;
  if(!arg||arg==='+') to=c.value+1;
  else if(arg==='-') to=c.value-1;
  else if(/^[+-]\d{1,6}$/.test(arg)) to=c.value+parseInt(arg,10);
  else if(/^=?\d{1,7}$/.test(arg)) to=parseInt(arg.replace('=',''),10);
  else return;
  change(c.id,to,who);
}

/* ---------- Layout & Bühne ---------- */
function computeLayout(){
  if(state.format==='stack') return {W:600,H:780};
  if(state.format==='big') return {W:900,H:520};
  return {W:1600,H:200};
}
let lastVals=new Map(), curL=null; const anims=new Map();
function tiles(){const t=state.counters.map(c=>({c}));if(state.showTimer) t.push({timer:true});return t;}
function buildStage(L,out){
  curL=L; const st=stage.style;
  st.setProperty('--ct-fg',textOn(state.bg)==='#000000'?'0,0,0':'255,255,255');
  st.setProperty('--ct-card',state.bgMode==='full'?rgba(lighten(state.bg,.06),.75):rgba(state.bg,.94));
  if(state.bgMode==='full') out.push(bgLayer(L));
  else if(state.bgMode==='magenta'){const m=div('rg');place(m,{x:0,y:0,w:L.W,h:L.H});m.style.background='#ff00ff';out.push(m);}
  for(const c of state.counters){const pv=lastVals.get(c.id);if(pv!==undefined&&pv!==c.value) anims.set(c.id,{d:c.value-pv,t0:performance.now()});}
  const card=div('rg ct-card ct-'+state.format+(state.brand?' has-brand':'')); place(card,{x:0,y:0,w:L.W,h:L.H});
  const title=state.title.trim();
  if(state.format==='big') buildBig(L,card,title);
  else{
    if(title){const h=div('ct-head');const t=el('div','ct-title',title);h.append(t);card.append(h);}
    const box=div('ct-tiles'); card.append(box);
    const T=tiles(), n=Math.max(1,T.length);
    const rowW=state.format==='row'?(L.W-(title?300:0)-40-(n-1)*14)/n:L.W-48;
    const rowH=state.format==='stack'?Math.min(150,(L.H-(title?96:24)-(state.brand?50:24)-(n-1)*12)/n):L.H-36-(state.brand?24:0);
    for(const t of T) box.append(tileEl(t,rowW,rowH));
    if(!T.length) box.append(el('div','ct-empty','–'));
  }
  if(state.brand){
    const bh=state.format==='row'?22:26, b=brandBox({x:0,y:0,w:10,h:bh},state.bg); b.classList.remove('rg'); b.classList.add('ct-brand');
    b.style.cssText+=';position:absolute;width:auto;height:auto;left:auto;top:auto'; card.append(b);
  }
  out.push(card);
  for(const c of state.counters) lastVals.set(c.id,c.value);
}
function floatEl(id,v,cls){
  const a=anims.get(id); if(!a) return null; const age=performance.now()-a.t0;
  if(age>1200){anims.delete(id);return null;}
  if(age<550){v.classList.add('bump');v.style.animationDelay=(-age)+'ms';}
  const f=el('div','ct-float'+cls+(a.d<0?' neg':''),(a.d>0?'+':'−')+fmtNum(Math.abs(a.d))); f.style.animationDelay=(-age)+'ms'; return f;
}
function valFs(v,w,base){const len=Math.max(2,String(fmtNum(v)).length);return Math.round(Math.min(base,w/(len*.62)));}
function tileEl(t,w,h){
  const row=state.format==='row', e=div('ct-tile'); e.style.width=w+'px'; e.style.height=h+'px';
  if(t.timer){
    e.classList.add('ct-timer');
    const ic=el('div','ct-ic','⏱'), info=div('ct-info'), nm=el('div','ct-name',state.timerName.trim()||i18n('timerDefault')), v=el('div','ct-val',fmtTime(elapsed()));
    const fs=row?Math.min(76,h*.44,w*.17):Math.min(70,h*.5); v.style.fontSize=Math.round(fs)+'px'; nm.style.fontSize=Math.round(fs*.32)+'px'; ic.style.fontSize=Math.round(fs*.7)+'px';
    if(!state.timer.run) e.classList.add('paused');
    info.append(nm,v); e.append(ic,info); return e;
  }
  const c=t.c, prev=lastVals.get(c.id), reached=c.goal>0&&c.value>=c.goal;
  if(reached) e.classList.add('reached');
  const ic=c.icon.trim()?el('div','ct-ic',c.icon.trim()):null;
  const info=div('ct-info'), nm=el('div','ct-name',nameOf(c));
  const base=row?Math.min(84,h*.48):Math.min(80,h*.55), vw=row?w-(ic?base*1.1:0)-40:w*.42;
  const vr=div('ct-vrow'), v=el('div','ct-val',fmtNum(c.value)); v.style.fontSize=valFs(c.value,vw,base)+'px';
  vr.append(v);
  if(c.goal>0&&state.showGoal){const g=el('div','ct-goal','/ '+fmtNum(c.goal));g.style.fontSize=Math.round(base*.36)+'px';vr.append(g);}
  nm.style.fontSize=Math.round(base*.3)+'px'; if(ic) ic.style.fontSize=Math.round(base*.72)+'px';
  info.append(nm,vr);
  if(ic) e.append(ic); e.append(info);
  if(c.goal>0&&state.showGoal){const bar=div('ct-bar'),i=el('i');i.style.width=Math.max(0,Math.min(100,c.value/c.goal*100))+'%';bar.append(i);e.append(bar);}
  const fl=floatEl(c.id,v,''); if(fl){fl.style.fontSize=Math.round(base*.42)+'px';e.append(fl);}
  return e;
}
function buildBig(L,card,title){
  const c=ctById(state.focus)||state.counters[0];
  card.classList.add('ct-bigc');
  if(title){const t=el('div','ct-title',title);t.style.fontSize='30px';card.append(t);}
  if(!c){card.append(el('div','ct-empty','–'));return;}
  const prev=lastVals.get(c.id), reached=c.goal>0&&c.value>=c.goal;
  const head=div('ct-bhead'); if(c.icon.trim()) head.append(el('span','ct-ic',c.icon.trim())); head.append(el('span','ct-name',nameOf(c)));
  const hasGoal=c.goal>0&&state.showGoal, used=60+(title?46:0)+54+(hasGoal?70:0)+(state.showTimer?46:0)+12*(2+(title?1:0)+(hasGoal?1:0)+(state.showTimer?1:0));
  const v=el('div','ct-val',fmtNum(c.value)); v.style.fontSize=Math.round(Math.min(valFs(c.value,L.W-120,220),(L.H-used)*1.05))+'px';
  card.append(head,v);
  if(reached) card.classList.add('reached');
  if(c.goal>0&&state.showGoal){
    const g=div('ct-bgoal'), bar=div('ct-bar'), i=el('i'); i.style.width=Math.max(0,Math.min(100,c.value/c.goal*100))+'%'; bar.append(i);
    g.append(bar,el('span',null,reached?i18n('goalReached'):fmtNum(c.value)+' / '+fmtNum(c.goal))); card.append(g);
  }
  if(state.showTimer){const t=div('ct-btimer');t.append(el('span',null,'⏱ '+(state.timerName.trim()||i18n('timerDefault'))),el('b','ct-tval',fmtTime(elapsed())));if(!state.timer.run) t.classList.add('paused');card.append(t);}
  const fl=floatEl(c.id,v,' big'); if(fl) card.append(fl);
}

/* ---------- Editor ---------- */
let zeroArm=0, resetArm=0, editDirty=false;
function renderTool(){renderPanel();}
function renderPanel(){
  const box=$('#ctrlList'); if(!box) return;
  box.replaceChildren(...state.counters.map((c,i)=>{
    const r=div('ct-ctrl'+(c.goal>0&&c.value>=c.goal?' reached':''));
    const lab=div('ct-lab'); lab.append(el('kbd',null,String(i+1)),el('span','ct-ci',c.icon||''),el('b',null,nameOf(c)));
    const minus=el('button','ct-pm','−'), plus=el('button','ct-pm primary','+'), val=el('div','ct-v',fmtNum(c.value));
    minus.onclick=()=>bump(c.id,-1); plus.onclick=()=>bump(c.id,1);
    const goal=el('span','ct-g',c.goal>0?'/ '+fmtNum(c.goal):'');
    const zero=el('button','small ghost','0'); zero.title='0'; zero.onclick=()=>change(c.id,0,'');
    r.append(lab,minus,val,plus,goal,zero); return r;
  }));
  $('#timerCtl').hidden=!state.showTimer;
  $('#btnTimer').textContent=i18n(state.timer.run?'timerPause':'timerStart');
  $('#timerVal').textContent=fmtTime(elapsed());
  $('#btnUndo').disabled=!state.log.length;
  const lg=$('#logList');
  if(!state.log.length) lg.replaceChildren(el('div','muted',i18n('logEmpty')));
  else lg.replaceChildren(...state.log.slice(0,12).map(l=>{
    const c=ctById(l.id), it=div('it');
    it.append(el('small',null,new Date(l.t).toTimeString().slice(0,8)),el('b',null,c?nameOf(c):'?'),el('span',null,fmtNum(l.from)+' → '+fmtNum(l.to)),el('small',null,i18n('logBy',{n:l.by||i18n('logYou')})));
    return it;
  }));
}
function renderToolSidebar(){
  const box=$('#ctEdit'); if(!box) return;
  const ae=document.activeElement; if(ae&&ae.tagName==='INPUT'&&box.contains(ae)){editDirty=true;}
  else{
    editDirty=false;
    box.replaceChildren(...state.counters.map(c=>{
      const r=div('ct-erow');
      const mk=(cls,val,ph,max,type,title)=>{const x=document.createElement('input');x.type=type||'text';x.className=cls;x.value=val;x.placeholder=ph;if(max) x.maxLength=max;if(title) x.title=title;x.spellcheck=false;x.autocomplete='off';x.onblur=()=>{if(editDirty) setTimeout(renderToolSidebar,0);};return x;};
      const ic=mk('ct-eic',c.icon,i18n('phIcon'),8), nm=mk('ct-enm',c.name,i18n('phName'),40), cmd=mk('ct-ecmd',c.cmd,i18n('phCmd'),24,'text',i18n('cmdTitle')), goal=mk('ct-egoal',c.goal||'',i18n('phGoal'),7,'number',i18n('goalTitle'));
      goal.min='0';
      const upd=(k,fn)=>e=>{const x=ctById(c.id);if(!x) return;x[k]=fn(e.target.value);commit({skipSidebar:true});};
      ic.oninput=upd('icon',v=>v.slice(0,8)); nm.oninput=upd('name',v=>v.slice(0,40)); cmd.oninput=upd('cmd',v=>v.slice(0,24)); goal.oninput=upd('goal',v=>Math.max(0,Math.min(VMAX,Math.round(+v||0))));
      const x=el('button','small ghost','✕'); x.onclick=()=>{state.counters=state.counters.filter(k=>k.id!==c.id);commit();};
      const l1=div('ct-el'); l1.append(ic,nm,x); const l2=div('ct-el'); l2.append(cmd,goal);
      r.append(l1,l2); return r;
    }));
  }
  $('#btnAddCt').disabled=state.counters.length>=MAX_CT;
  $('#timerFields').hidden=!state.showTimer;
  $('#cdRow').hidden=state.cmdWho!=='all';
  const fs=$('#focusSel'); fs.replaceChildren(...state.counters.map(c=>{const o=document.createElement('option');o.value=c.id;o.textContent=(c.icon?c.icon+' ':'')+nameOf(c);return o;}));
  fs.value=ctById(state.focus)?state.focus:(state.counters[0]||{}).id||''; $('#focusRow').hidden=state.format!=='big';
}
function toolKeys(e){
  if(e.ctrlKey||e.metaKey||e.altKey) return false;
  const m=/^Digit([1-6])$/.exec(e.code);
  if(m){const c=state.counters[+m[1]-1];if(c){bump(c.id,e.shiftKey?-1:1);return true;}return false;}
  if(e.key==='t'||e.key==='T'){if(state.showTimer) timerToggle();return true;}
  if(e.key==='z'||e.key==='Z'){undo();return true;}
  return false;
}
function toolInit(){
  $('#btnAddCt').onclick=()=>{
    if(state.counters.length>=MAX_CT){toast(i18n('tMax'));return;}
    state.counters.push({id:uid(),name:'',icon:'',value:0,goal:0,cmd:''}); commit();
    setTimeout(()=>{const x=$$('#ctEdit .ct-enm');if(x.length) x[x.length-1].focus();},0);
  };
  $('#btnUndo').onclick=undo;
  $('#btnTimer').onclick=()=>timerToggle();
  $('#btnTimerReset').onclick=e=>{const b=e.currentTarget;if(!resetArm){b.textContent=i18n('timerResetSure');resetArm=setTimeout(()=>{resetArm=0;b.textContent=i18n('timerReset');},3000);return;}clearTimeout(resetArm);resetArm=0;b.textContent=i18n('timerReset');timerReset();};
  $('#btnZero').onclick=e=>{
    const b=e.currentTarget;
    if(!zeroArm){b.textContent=i18n('allZeroSure');zeroArm=setTimeout(()=>{zeroArm=0;b.textContent=i18n('allZero');},3000);return;}
    clearTimeout(zeroArm);zeroArm=0;b.textContent=i18n('allZero');
    for(const c of state.counters) if(c.value!==0){state.log.unshift({id:c.id,from:c.value,to:0,t:Date.now(),by:''});c.value=0;}
    state.log=state.log.slice(0,50); commit({skipSidebar:true});
  };
  $('#focusSel').onchange=e=>{state.focus=e.target.value;commit({skipSidebar:true});e.target.blur();};
  setInterval(()=>{
    if(!state.showTimer) return;
    const s=fmtTime(elapsed());
    for(const v of $$('.ct-timer .ct-val, .ct-btimer .ct-tval',stage)) if(v.textContent!==s) v.textContent=s;
    const tv=$('#timerVal'); if(tv&&tv.textContent!==s) tv.textContent=s;
  },250);
}

coreStart();
})();
</script>
