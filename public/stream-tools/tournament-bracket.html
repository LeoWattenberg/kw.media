<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="dark">
<title>Turnier · kw.media</title>
<link rel="icon" id="favicon" href="data:,">
<!--
  kw.media Stream-Toolkit · Turnier – v0.1
  Läuft komplett lokal im Browser: keine Uploads, keine Werbung, kein Tracking.
-->
<style>
:root{--accent:#ff6900;--accent-text:#000;--accent-glow:rgba(255,105,0,.45);--accent-soft:rgba(255,105,0,.28);--bg:#2b2b2b;--panel:#363636;--panel2:#404040;--line:#4d4d4d;--text:#fff;--muted:#b5b5b5;--font:Ubuntu,"Segoe UI",system-ui,-apple-system,Roboto,Arial,sans-serif}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--text);font:14px/1.4 var(--font);-webkit-font-smoothing:antialiased}
html.see-through,html.see-through body{background:transparent!important}
[hidden]{display:none!important}
button{font:inherit;color:inherit;background:var(--panel2);border:1px solid var(--line);border-radius:9px;padding:8px 12px;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:6px;white-space:nowrap;transition:background .15s,border-color .15s}
button:hover{background:#4a4a4a;border-color:#5c5c5c}
button:disabled{opacity:.5;cursor:default}
button.primary{background:var(--accent);border-color:transparent;color:var(--accent-text);font-weight:700}
button.primary:hover{filter:brightness(1.1);background:var(--accent)}
button.ghost{background:transparent;border-color:transparent}
button.small{padding:5px 9px;font-size:12px}
button.big{padding:12px 18px;font-size:16px}
.danger{color:#f87171}
kbd{display:inline-block;font:700 11px/1 var(--font);padding:3px 6px;border-radius:5px;background:#2b2b2b;border:1px solid var(--line);color:var(--muted);vertical-align:middle}
input[type=text],input[type=number],input[type=datetime-local],input[type=time],select,textarea{width:100%;background:var(--panel2);border:1px solid var(--line);color:var(--text);border-radius:8px;padding:8px 10px;font:inherit;outline:none}
input:focus,select:focus,textarea:focus{border-color:var(--accent)}
textarea{resize:vertical;min-height:70px}
input[type=color]{width:34px;height:34px;padding:2px;border:1px solid var(--line);border-radius:8px;background:var(--panel2);cursor:pointer}
input[type=checkbox]{accent-color:var(--accent);width:16px;height:16px;margin:0}
input[type=range]{accent-color:var(--accent);width:100%}
.muted{color:var(--muted)}
.topbar{position:sticky;top:0;z-index:20;display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 16px;background:rgba(43,43,43,.95);backdrop-filter:blur(10px);border-bottom:1px solid var(--line);flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:16px}
.brand-logo{height:32px;width:auto;display:block}
.brand-txt{border-left:1px solid var(--line);padding-left:16px}
.brand b{display:block;font-size:15px;line-height:1.1}.brand small{color:var(--muted);font-size:12px}
.actions{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.layout{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:16px;padding:16px 16px 40px;max-width:1720px;margin:0 auto}
@media (max-width:980px){.layout{grid-template-columns:1fr}}
@media (max-width:700px){.topbar{position:static}}
.stage-wrap{position:relative;width:100%;border-radius:14px;overflow:hidden;background:#1a1a1a;border:1px solid var(--line)}
.stage-wrap.checker{background:repeating-conic-gradient(#333 0 25%,#262626 0 50%) 0 0/32px 32px}
.panel{margin-top:14px;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:12px}
.panel-head{display:flex;align-items:center;gap:10px;margin-bottom:10px;flex-wrap:wrap}
.side{display:flex;flex-direction:column;gap:12px;min-width:0}
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px}
.card h3{margin:0 0 12px;font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);display:flex;justify-content:space-between;align-items:center;gap:8px}
.field{display:flex;flex-direction:column;gap:5px;margin-bottom:12px}
.field>span{font-size:12px;color:var(--muted)}
.seg{display:flex;background:var(--panel2);border:1px solid var(--line);border-radius:9px;padding:3px;gap:3px}
.seg button{flex:1;border:0;background:transparent;padding:6px 8px;border-radius:7px}
.seg button.on{background:var(--accent);color:var(--accent-text);font-weight:700}
.check{display:flex;align-items:center;gap:9px;margin:8px 0;cursor:pointer;user-select:none}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.hint-text{font-size:12px;color:var(--muted);margin:8px 0 0;line-height:1.45}
.warn{color:#fbbf24}
.colors{display:flex;gap:16px;margin-top:10px;flex-wrap:wrap}
.colors label{display:flex;align-items:center;gap:8px;color:var(--muted);font-size:12px}
.adv{margin-top:14px;border-top:1px solid var(--line);padding-top:10px}
.adv summary{cursor:pointer;color:var(--muted);font-size:12px;list-style:none;user-select:none}
.adv summary::-webkit-details-marker{display:none}
.adv summary::before{content:'▸ '}
.adv[open] summary::before{content:'▾ '}
.chat-status{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--muted);margin:10px 0 4px}
.chat-status i{width:9px;height:9px;border-radius:50%;background:#5c5c5c;flex:none}
.chat-status.on i{background:#22c55e;box-shadow:0 0 8px #22c55e}
.chat-status.wait i{background:#eab308}
.chat-status.err i{background:#ef4444}
.lang-btn{gap:7px}
.lang-btn small{color:var(--muted);font-size:11px;letter-spacing:.06em}
.menu{position:relative}
.menu-pop{position:absolute;right:0;top:calc(100% + 6px);display:none;flex-direction:column;min-width:240px;max-width:calc(100vw - 24px);background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:6px;box-shadow:0 20px 50px rgba(0,0,0,.55);z-index:50}
.menu.open .menu-pop{display:flex}
.menu-pop button{background:transparent;border:0;justify-content:flex-start;padding:9px 10px;border-radius:8px;text-align:left}
.menu-pop button:hover{background:var(--panel2)}
.menu-pop small{color:var(--muted);margin-left:auto;padding-left:12px}
#toast{position:fixed;left:50%;top:78px;transform:translate(-50%,-10px);opacity:0;transition:opacity .2s,transform .2s;background:#404040;border:1px solid var(--line);padding:10px 16px;border-radius:10px;z-index:3000;pointer-events:none;max-width:calc(100% - 32px);text-align:center}
#toast.show{opacity:1;transform:translate(-50%,0)}
#streamHint{position:fixed;top:12px;right:12px;display:none;background:rgba(54,54,54,.94);border:1px solid var(--line);border-radius:10px;padding:8px 12px;font-size:13px;color:var(--muted);z-index:50}
dialog{background:var(--panel);color:var(--text);border:1px solid var(--line);border-radius:16px;max-width:640px;width:calc(100% - 32px);padding:22px 24px}
dialog::backdrop{background:rgba(0,0,0,.6)}
dialog h2{margin:0 0 6px;font-size:20px}
dialog h4{margin:18px 0 6px}
dialog ol{padding-left:20px;margin:6px 0}
dialog li{margin-bottom:8px}
dialog p,dialog li{color:#d6d6d6}
.dlg-foot{display:flex;justify-content:flex-end;gap:8px;margin-top:14px;flex-wrap:wrap}
.list{display:flex;flex-direction:column;gap:6px}
.list .li{display:flex;align-items:center;gap:8px}
.list .li b,.list .li span.t{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* Bühne */
.stage{position:absolute;left:0;top:0;transform-origin:0 0;overflow:hidden;font-family:var(--font);color:#fff}
.rg{position:absolute}
.cam{display:grid;place-items:center;overflow:hidden}
.cam.fill-placeholder{background:rgba(255,255,255,.035)}
.cam.fill-green{background:#00ff00}
.cam.fill-magenta{background:#ff00ff}
.cam.fill-blue{background:#0000ff}
.cam.fill-transparent{background:transparent}
body:not(.streaming) .cam.fill-transparent{background:repeating-conic-gradient(#3a3a3a 0 25%,#2a2a2a 0 50%) 0 0/40px 40px}
.cam-ph{display:flex;flex-direction:column;align-items:center;gap:10px;color:rgba(255,255,255,.3);font-weight:800;letter-spacing:.2em;font-size:22px}
.fill-green .cam-ph{color:rgba(0,0,0,.45)}
.fill-magenta .cam-ph,.fill-blue .cam-ph{color:rgba(255,255,255,.75)}
.cam-ring{border:4px solid var(--accent);box-shadow:0 0 34px var(--accent-glow);pointer-events:none}
.brand-rg{display:flex;align-items:center;justify-content:flex-end;gap:1em;color:rgba(255,255,255,.45);white-space:nowrap}
.brand-rg.on-light{color:rgba(0,0,0,.55)}
.brand-rg img{display:block}
.fit span{display:block;white-space:pre;line-height:1.1}
@keyframes pop{0%{transform:scale(.6);opacity:.2}100%{transform:none;opacity:1}}
@keyframes fadein{from{opacity:0}to{opacity:1}}
@keyframes fadeout{to{opacity:0}}

/* Stream-Ansicht */
body.streaming .topbar,body.streaming .side,body.streaming .panel,body.streaming #toast{display:none!important}
body.streaming .layout{display:block;padding:0;max-width:none}
body.streaming .stage-wrap{position:fixed;inset:0;border:0;border-radius:0;height:auto!important;background:#000}
html.see-through body.streaming .stage-wrap{background:transparent}
body.streaming .editor-only{display:none!important}
body.streaming #streamHint.show{display:block}

/* Eingebettet auf kw.media */
html.embedded .topbar .brand,html.embedded #btnLang{display:none!important}
html.embedded .topbar{justify-content:flex-end}

/* --- Tool --- */
/* Duell */
.tb-head{display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;color:rgb(var(--tb-fg));gap:4px;line-height:1.1}
.tb-head.left{align-items:flex-start;text-align:left}
.tb-title{font-weight:700;opacity:.55;letter-spacing:.12em;text-transform:uppercase;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.tb-round{font-weight:800;white-space:nowrap}
.tb-sub{font-weight:700;color:var(--accent)}
.tb-card{border-radius:30px;background:var(--tb-card);border:3px solid rgba(var(--tb-fg),.08);overflow:hidden;transition:opacity .5s,filter .5s;cursor:pointer;box-shadow:0 24px 60px rgba(0,0,0,.35)}
body.streaming .tb-card{cursor:default}
.tb-card>*{position:absolute}
.tb-card.win{border-color:var(--accent);box-shadow:0 0 0 6px var(--accent-soft),0 0 90px var(--accent-glow);animation:tbwin .7s cubic-bezier(.2,1.5,.4,1)}
@keyframes tbwin{0%{transform:scale(.95)}60%{transform:scale(1.035)}100%{transform:none}}
.tb-card.lose{opacity:.35;filter:grayscale(.85)}
.tb-img{border-radius:20px;overflow:hidden;background:rgba(0,0,0,.25)}
.tb-img img{width:100%;height:100%;object-fit:cover;display:block}
.tb-name{display:flex;align-items:center;justify-content:center;text-align:center;font-weight:800;color:rgb(var(--tb-fg))}
.tb-name span{text-align:center}
.tb-num{border-radius:50%;background:var(--accent);color:var(--accent-text);display:grid;place-items:center;font-weight:800;box-shadow:0 6px 20px rgba(0,0,0,.4);z-index:2}
.tb-vote{border-radius:16px;background:rgba(var(--tb-fg),.08);overflow:hidden;display:flex;align-items:center;justify-content:space-between;padding:0 .8em;font-weight:800;color:rgb(var(--tb-fg))}
.tb-vote .fill{position:absolute;left:0;top:0;bottom:0;background:var(--accent-soft)}
.tb-card.win .tb-vote .fill{background:var(--accent)}
.tb-vote span{position:relative;z-index:1;text-shadow:0 1px 3px rgba(0,0,0,.4)}
.tb-vote .cnt{opacity:.8;font-weight:700}
.tb-rib{background:var(--accent);color:var(--accent-text);font-weight:800;padding:.3em .9em;border-radius:999px;letter-spacing:.1em;text-transform:uppercase;z-index:2;animation:pop .5s .15s both;box-shadow:0 6px 20px rgba(0,0,0,.35)}
.tb-vs{border-radius:50%;background:var(--accent);color:var(--accent-text);display:grid;place-items:center;font-weight:900;font-style:italic;box-shadow:0 0 0 10px rgba(0,0,0,.28),0 0 60px var(--accent-glow);z-index:3}
.tb-cta{display:flex;align-items:center;justify-content:center;flex-wrap:wrap;gap:0 .35em;font-weight:700;color:rgb(var(--tb-fg));text-align:center;line-height:1.35}
.tb-cta.side{justify-content:flex-end;text-align:right}
.tb-cta b{background:var(--accent);color:var(--accent-text);border-radius:.3em;padding:0 .35em;margin:0 .05em}
.tb-cta .cd{font-variant-numeric:tabular-nums;color:var(--accent);margin-left:.25em}
/* Sieger */
.tb-champ{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2%;border-radius:40px;background:var(--tb-card);border:4px solid var(--accent);box-shadow:0 0 140px var(--accent-glow);color:rgb(var(--tb-fg));animation:tbchamp .8s cubic-bezier(.2,1.4,.4,1) both;text-align:center}
@keyframes tbchamp{0%{transform:scale(.5);opacity:0}100%{transform:none;opacity:1}}
.tb-trophy{color:var(--accent);filter:drop-shadow(0 0 30px var(--accent-glow))}
.tb-trophy svg{display:block}
.tb-clab{font-weight:800;letter-spacing:.2em;text-transform:uppercase;opacity:.7}
.tb-cimg{border-radius:24px;overflow:hidden;box-shadow:0 20px 50px rgba(0,0,0,.45)}
.tb-cimg img{width:100%;height:100%;object-fit:cover;display:block}
.tb-cname{display:flex;align-items:center;justify-content:center;color:var(--accent);font-weight:800}
.tb-cname span{text-align:center}
.tb-empty{display:grid;place-items:center;font-size:44px;font-weight:700;color:rgba(var(--tb-fg),.45)}
.tb-tree svg{display:block}
.tb-tree .tb-m{cursor:pointer}
.tb-tree .tb-m:hover rect{filter:brightness(1.15)}
body.streaming .tb-tree .tb-m{cursor:default}
.tb-hl{animation:tbdash 1.2s linear infinite}
@keyframes tbdash{to{stroke-dashoffset:-34}}
/* Editor */
.tb-ctrl .tb-pick{max-width:230px;justify-content:flex-start}
.tb-ctrl .tb-pick b{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:0 6px;flex:none}
.tb-ctrl .tb-pick span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.tb-ctrl .tb-pick.on{border-color:var(--accent);color:var(--accent)}
.tb-ctrl .seg{min-width:220px}
.tb-status{display:flex;align-items:center;gap:10px;font-weight:600}
.tb-ents{display:flex;flex-direction:column;gap:5px;max-height:420px;overflow:auto;margin-bottom:10px;padding-right:2px}
.ent{display:flex;align-items:center;gap:6px}
.ent-n{width:20px;text-align:right;color:var(--muted);font-size:12px;font-variant-numeric:tabular-nums;flex:none}
.ent-th{width:34px;height:34px;padding:0;flex:none;border-radius:8px;overflow:hidden;color:var(--muted);font-size:18px}
.ent-th img{width:100%;height:100%;object-fit:cover;display:block}
.ent input{flex:1;min-width:0;padding:6px 8px}
#entCard.tb-drop{outline:2px dashed var(--accent);outline-offset:3px}
#btnImgs{flex:none}

</style>
</head>
<body>
<header class="topbar">
  <div class="brand"><img class="brand-logo" id="brandLogo" alt="kw.media"><div class="brand-txt"><b data-i18n="appName"></b><small data-i18n="tagline"></small></div></div>
  <div class="actions">
    
    <div class="menu"><button data-menu data-i18n="menuExport"></button><div class="menu-pop"><button data-export="1:1" data-i18n="exp11"></button><button data-export="9:16" data-i18n="exp916"></button><button data-export="16:9" data-i18n="exp169"></button></div></div>
    <button id="btnPopup" data-i18n="popup" data-i18n-title="popupTitle"></button>
    <button id="btnStream" data-i18n="streamView"></button>
    <button id="btnLang" class="ghost lang-btn"></button>
    <button id="btnHelp" class="ghost" data-i18n-aria="help">?</button>
  </div>
</header>
<main class="layout">
  <section class="left">
    <div id="stageWrap" class="stage-wrap"><div id="stage" class="stage"></div></div>
    <div class="panel">
  <div class="panel-head tb-ctrl">
    <button id="btnUndo" data-i18n="undo" data-i18n-title="undoTitle"></button>
    <button id="btnVote" class="primary"></button>
    <button id="btnA" class="tb-pick"></button>
    <button id="btnB" class="tb-pick"></button>
    <button id="btnNext"></button>
    <span style="flex:1"></span>
    <div class="seg" data-seg="view" id="viewSeg"><button data-val="duel" data-i18n="viewDuel"></button><button data-val="bracket" data-i18n="viewTree"></button></div>
  </div>
  <div class="tb-status"><span id="tbStatus"></span><span style="flex:1"></span><button id="btnRestart" class="small ghost danger" data-i18n="restart"></button></div>
  <p class="hint-text" data-i18n="keysHint"></p>
</div>

  </section>
  <aside class="side">
    <div class="card" id="entCard">
  <h3><span data-i18n="cardEntries"></span><span id="entCount"></span></h3>
  <p class="hint-text warn" id="lockNote" data-i18n="lockNote" style="margin:0 0 10px"></p>
  <div id="entList" class="tb-ents"></div>
  <div class="row" style="flex-wrap:nowrap"><input type="text" id="entAdd" data-i18n-ph="addPh" maxlength="60" autocomplete="off" spellcheck="false"><button id="btnImgs" data-i18n-title="imgsTitle">🖼</button></div>
  <p class="hint-text" data-i18n="dropHint"></p>
  <div class="row" style="margin-top:8px"><button id="btnShuffle" class="small" data-i18n="shuffle"></button><button id="btnPaste" class="small" data-i18n="paste"></button><span style="flex:1"></span><button id="btnClearEnt" class="small ghost danger" data-i18n="clearAll"></button></div>
  <input type="file" id="imgFile" accept="image/*" hidden>
  <input type="file" id="imgFiles" accept="image/*" multiple hidden>
</div>
<div class="card">
  <h3 data-i18n="cardVote"></h3>
  <p class="hint-text" data-i18n="voteHint" style="margin:0 0 10px"></p>
  <div class="field"><span data-i18n="fVoteSec"></span><div class="seg" data-seg="voteSec"><button data-val="0" data-i18n="off"></button><button data-val="30">30 s</button><button data-val="60">60 s</button><button data-val="90">90 s</button><button data-val="120">2 min</button></div></div>
  <label class="check"><input type="checkbox" data-key="autoVote"> <span data-i18n="fAutoVote"></span></label>
  <label class="check"><input type="checkbox" data-key="allowChange"> <span data-i18n="fAllowChange"></span></label>
</div>
<div class="card">
      <h3 data-i18n="cardChat"></h3>
      <label class="field"><span data-i18n="twitchChannel"></span><input type="text" data-key="chatChannel" maxlength="40" data-i18n-ph="twitchPh" autocomplete="off" spellcheck="false"></label>
      <button id="btnChat" class="small primary"></button>
      <div class="chat-status" id="chatStatus"><i></i><span></span></div>
      
    </div>
<div class="card">
  <h3 data-i18n="cardLook"></h3>
  <label class="field"><span data-i18n="fTitle"></span><input type="text" data-key="title" maxlength="80" data-i18n-ph="titleDefault"></label>
  <label class="check"><input type="checkbox" data-key="autoTree"> <span data-i18n="fAutoTree"></span></label>
</div>
<div class="card">
      <h3 data-i18n="cardLayout"></h3>
      <div class="field"><span data-i18n="fFormat"></span><div class="seg" data-seg="format"><button data-val="16:9">16:9</button><button data-val="9:16">9:16</button></div></div>
      
      <div class="field"><span data-i18n="camSlots"></span><div class="seg" data-seg="cams"><button data-val="0" data-i18n="none"></button><button data-val="1">1</button><button data-val="2">2</button></div></div>
      <label class="field"><span data-i18n="camFill"></span>
        <select data-key="camFill">
          <option value="placeholder" data-i18n="fillPlaceholder"></option>
          <option value="transparent" data-i18n="fillTransparent"></option>
          <option value="magenta" data-i18n="fillMagenta"></option>
          <option value="blue" data-i18n="fillBlue"></option>
          <option value="green" data-i18n="fillGreen"></option>
        </select>
      </label>
      <label class="check"><input type="checkbox" data-key="camRing"> <span data-i18n="camRing"></span></label>
      <div class="colors">
        <label><input type="color" data-key="bg"> <span data-i18n="bgColor"></span></label>
        <label><input type="color" data-key="accent"> <span data-i18n="accentColor"></span></label>
      </div>
      <details class="adv"><summary data-i18n="advanced"></summary>
        <label class="check"><input type="checkbox" data-key="brand"> <span data-i18n="showBrand"></span></label>
      </details>
    </div>

  </aside>
</main>
<div id="toast"></div>
<div id="streamHint" data-i18n="streamHint"></div>
<dialog id="pasteDlg">
  <h2 data-i18n="pasteTitle"></h2>
  <p class="muted" data-i18n="pasteText"></p>
  <textarea id="pasteArea" rows="10" spellcheck="false"></textarea>
  <div class="dlg-foot"><button class="ghost" id="pasteCancel" data-i18n="cancel"></button><button class="primary" id="pasteOk" data-i18n="pasteAdd"></button></div>
</dialog>

<dialog id="brandDlg">
  <h2 data-i18n="brandDlgTitle"></h2>
  <p data-i18n="brandDlgText"></p>
  <div class="dlg-foot"><button id="brandKeep" class="ghost" data-i18n="brandKeep"></button><button id="brandOff" data-i18n="brandOffAnyway"></button><button id="brandSub" class="primary" data-i18n="brandSub"></button></div>
</dialog>
<dialog id="help">
  <h2 data-i18n="helpTitle"></h2>

function normalizeCommon(s,o){

  if(isHex(s.bg)) o.bg=s.bg; if(isHex(s.accent)) o.accent=s.accent;

/* ---------- Twitch-Chat (anonym, nur lesen) ---------- */
const IRC_URL=(()=>{const u=new URLSearchParams(location.search).get('irc');return u&&/^wss?:\/\/(127\.0\.0\.1|localhost)(:\d+)?\/?$/.test(u)?u:'wss://irc-ws.chat.twitch.tv:443';})();
const chat={ws:null,want:false,status:'off',retry:0,timer:0,joinT:0,channel:'',msg:null};
const cleanChannel=c=>String(c||'').trim().toLowerCase().replace(/^https?:\/\/(www\.|m\.)?twitch\.tv\//,'').replace(/^[#@]/,'').replace(/[^a-z0-9_]/g,'').slice(0,25);
function setChatStatus(st,key,params){chat.status=st;chat.msg=key?[key,params]:null;paintChatStatus();if(typeof onChatStatus==='function') onChatStatus(st);}
function paintChatStatus(){
  const box=$('#chatStatus'); if(!box) return; const st=chat.status;
  box.className='chat-status '+({on:'on',connecting:'wait',reconnecting:'wait',error:'err'}[st]||'');
  box.querySelector('span').textContent=chat.msg?i18n(chat.msg[0],chat.msg[1]):i18n({off:'stOff',connecting:'stConnecting',reconnecting:'stReconnecting',on:'stOn',error:'stError'}[st],{ch:chat.channel});
  const b=$('#btnChat'); if(b){b.textContent=i18n(chat.want?'disconnect':'connect'); b.classList.toggle('primary',!chat.want);}
}
function chatConnect(){
  const ch=cleanChannel(state.chatChannel); if(!ch){toast(i18n('tEnterChannel'));return;}
  chatDisconnect(true); chat.channel=ch; chat.want=true; chat.retry=0;
  if(!state.chatAuto){state.chatAuto=true;commit({skipSidebar:true});}
  openSocket();
}
function chatDisconnect(silent){
  chat.want=false; clearTimeout(chat.timer); clearTimeout(chat.joinT);
  const ws=chat.ws; chat.ws=null; if(ws){try{ws.close();}catch(e){}}
  if(!silent&&state.chatAuto){state.chatAuto=false;commit({skipSidebar:true});}
  setChatStatus('off');
}
function openSocket(){
  setChatStatus(chat.retry?'reconnecting':'connecting');
  let ws; try{ws=new WebSocket(IRC_URL);}catch(e){setChatStatus('error','stImpossible');return;}
  chat.ws=ws;
  ws.onopen=()=>{ws.send('CAP REQ :twitch.tv/tags twitch.tv/commands');ws.send('PASS SCHMOOPIIE');ws.send('NICK justinfan'+(10000+Math.floor(Math.random()*80000)));ws.send('JOIN #'+chat.channel);
    clearTimeout(chat.joinT);chat.joinT=setTimeout(()=>{if(chat.ws===ws&&chat.status!=='on') setChatStatus('error','stNoAnswer',{ch:chat.channel});},8000);};
  ws.onmessage=e=>{if(chat.ws!==ws) return;for(const line of String(e.data).split('\r\n')) if(line) onIrc(line,ws);};
  ws.onclose=()=>{if(chat.ws!==ws) return;chat.ws=null;clearTimeout(chat.joinT);
    if(chat.want){const d=Math.min(30000,1000*2**Math.min(chat.retry++,5));setChatStatus('reconnecting');chat.timer=setTimeout(()=>{if(chat.want) openSocket();},d);}else setChatStatus('off');};
}
function onIrc(line,ws){
  if(line.startsWith('PING')){try{ws.send('PONG'+line.slice(4));}catch(e){}return;}
  let rest=line; const tags={};
  if(rest[0]==='@'){const i=rest.indexOf(' ');for(const kv of rest.slice(1,i).split(';')){const j=kv.indexOf('=');tags[kv.slice(0,j)]=kv.slice(j+1);}rest=rest.slice(i+1);}
  const m=/^(?::(\S+) )?(\S+)(?: (.*?))?(?: :(.*))?$/.exec(rest); if(!m) return;
  const prefix=m[1]||'',cmd=m[2],trail=m[4]||'';
  if(cmd==='ROOMSTATE'||cmd==='366'||(cmd==='JOIN'&&/^justinfan/.test(prefix))){if(chat.status!=='on'){clearTimeout(chat.joinT);chat.retry=0;setChatStatus('on');}return;}
  if(cmd==='RECONNECT'){try{ws.close();}catch(e){}return;}
  if((cmd==='CLEARCHAT'||cmd==='CLEARMSG')&&typeof onChatClear==='function'){onChatClear({id:cmd==='CLEARMSG'?(tags['target-msg-id']||''):'',user:cmd==='CLEARCHAT'?trail.trim().toLowerCase():'',all:cmd==='CLEARCHAT'&&!trail.trim()});return;}
  if(cmd==='NOTICE'&&/fail|invalid|banned|suspend|unavailable/i.test(trail)){setChatStatus('error','raw',{s:trail.slice(0,90)});return;}
  if(cmd==='PRIVMSG'&&typeof onChatMessage==='function'){
    const badges=tags.badges||'';
    onChatMessage({user:prefix.split('!')[0],name:(tags['display-name']||'').replace(/\\s/g,' ')||prefix.split('!')[0],text:trail,mod:/(^|,)(moderator|broadcaster)\//.test(badges),broadcaster:/(^|,)broadcaster\//.test(badges),sub:/(^|,)(subscriber|founder)\//.test(badges),vip:/(^|,)vip\//.test(badges),color:/^#[0-9a-f]{6}$/i.test(tags.color||'')?tags.color:'',emotes:tags.emotes||'',id:tags.id||'',source:'twitch'});
  }
}

function confettiOn(host,W,H,dur=3.6){
  const c=document.createElement('canvas'); c.className='confetti'; c.width=W; c.height=H; c.style.cssText='position:absolute;left:0;top:0;pointer-events:none;z-index:9'; host.append(c);

  return `<svg xmlns="http://www.w3.org/2000/svg" width="${W}" height="${H}" viewBox="0 0 ${W} ${H}" font-family="${F}" stroke-width="${lw}" stroke-linecap="round"><defs>${defs}</defs>${body}</svg>`;
}

/* ---------- Bühne ---------- */
let curL=null, flashActive=false, champShownAt=0, confettiCv=null, confettiEnd=0;
function buildStage(L,out){
  curL=L; const st=stage.style;
  st.setProperty('--tb-fg',textOn(state.bg)==='#000000'?'0,0,0':'255,255,255');
  st.setProperty('--tb-card',rgba(lighten(state.bg,.07),.92));
  out.push(bgLayer(L,state.camFill==='transparent'?L.cams:[]));
  camEls(L,out);
  const br=bracket(); flashActive=Date.now()<state.flash;
  stage.dataset.view='';
  if(br.n<2){const e=div('rg tb-empty');place(e,{x:0,y:0,w:L.W,h:L.H});e.textContent=i18n('emptyStage');out.push(e);}
  else if(state.view==='bracket'||flashActive){
    stage.dataset.view='tree';
    const w=div('rg tb-tree'); place(w,{x:0,y:0,w:L.W,h:L.H});
    w.innerHTML=bracketSVG(br,L.W,L.H,L.tree,L.two,{hl:displayKey(br),interactive:isOwner()});
    out.push(w);
  }else{
    const key=displayKey(br);
    if(key){stage.dataset.view='duel';buildDuel(L,out,br,key);}
    else{stage.dataset.view='champ';buildChamp(L,out,br);}
  }
  if(state.brand) out.push(brandBox(L.brand,state.bg));
  if(confettiCv&&performance.now()<confettiEnd) out.push(confettiCv);
}
function buildDuel(L,out,br,key){
  const D=L.duel, [r,m]=parseKey(key), [a,b]=slots(br,r,m), res=state.results[key], v=state.vote&&state.vote.key===key?state.vote:null, final=r===br.R-1;
  const head=div('rg tb-head'+(D.left?' left':'')); place(head,D.head);
  const t=el('div','tb-title',titleText()); t.style.fontSize=Math.round(Math.min(36,D.head.h*.24))+'px';
  const M=br.S>>(r+1), rn=roundName(br,r), sub=M>1?i18n('matchOf',{m:m+1,n:M}):'';
  const rd=div('tb-round'); rd.textContent=rn; rd.style.fontSize=Math.round(Math.min(70,D.head.h*.42,D.head.w/(rn.length*.62)))+'px';
  head.append(t,rd);
  if(sub){const sb=el('div','tb-sub',sub);sb.style.fontSize=Math.round(Math.min(28,D.head.h*.18))+'px';head.append(sb);}
  out.push(head);
  const hasRes=res&&(res.va||res.vb), votes=v?[v.a,v.b]:hasRes?[res.va,res.vb]:null;
  out.push(duelCard(a,D.A,0,res,votes,final),duelCard(b,D.B,1,res,votes,final));
  const vs=div('rg tb-vs'); place(vs,{x:D.vs.cx-D.vs.r,y:D.vs.cy-D.vs.r,w:2*D.vs.r,h:2*D.vs.r}); vs.textContent='VS'; vs.style.fontSize=Math.round(D.vs.r*.6)+'px'; out.push(vs);
  const cta=div('rg tb-cta'+(D.ctaSide?' side':'')); place(cta,D.cta); cta.style.fontSize=Math.round(Math.min(38,D.cta.h*(D.ctaSide?.2:.6)))+'px';
  cta.innerHTML=ctaHtml(br,key,res,v,final); out.push(cta);
}
function ctaHtml(br,key,res,v,final){
  if(res){const [a,b]=slots(br,...parseKey(key));return esc(i18n(final?'ctaChamp':'ctaWin',{n:nameOf(res.w?b:a)}));}
  if(v&&v.open) return i18n('ctaVote')+(v.until?` <span class="cd">${fmtLeft(v.until)}</span>`:'');
  if(v&&!v.open&&v.a===v.b&&(v.a||v.b)) return esc(i18n('ctaTie'));
  return esc(i18n('ctaWho'));
}
const fmtLeft=u=>{const s=Math.max(0,Math.ceil((u-Date.now())/1000));return Math.floor(s/60)+':'+pad2(s%60);};
function duelCard(id,box,side,res,votes,final){
  const e=entryById(id), c=div('rg tb-card'); place(c,box); c.dataset.side=side;
  if(res) c.classList.add(res.w===side?'win':'lose');
  const pad=Math.round(Math.min(box.w,box.h)*.045), voteH=votes?Math.round(Math.min(72,box.h*.11)):0, inner=box.w-2*pad;
  const name=e?(e.name.trim()||'?'):'—';
  if(e&&e.img){
    const nameH=Math.round(box.h*(box.w>box.h*1.3?.2:.17)), ih=box.h-pad*2-voteH-(voteH?pad*.6:0)-nameH-pad*.4;
    const fr=div('tb-img'); place(fr,{x:pad,y:pad,w:inner,h:ih}); const im=new Image(); im.src=e.img; im.alt=''; im.draggable=false; fr.append(im); c.append(fr);
    const nm=div('tb-name'); place(nm,{x:pad,y:pad+ih+pad*.4,w:inner,h:nameH}); fitInto(nm,name,inner,nameH,Math.round(nameH*.78),800,1.05,2); c.append(nm);
  }else{
    const nh=box.h-pad*2-voteH-(voteH?pad*.6:0), nm=div('tb-name'); place(nm,{x:pad,y:pad,w:inner,h:nh});
    fitInto(nm,name,inner*.88,nh*.72,Math.round(Math.min(nh*.36,box.w*.15)),800,1.05,3); c.append(nm);
  }
  const ns=Math.round(Math.min(box.w,box.h)*.12), num=el('div','tb-num',String(side+1));
  num.style.cssText=`width:${ns}px;height:${ns}px;font-size:${Math.round(ns*.55)}px;left:${pad*1.4}px;top:${pad*1.4}px`; c.append(num);
  if(votes){
    const tot=(votes[0]||0)+(votes[1]||0), mine=votes[side]||0, pct=tot?Math.round(mine/tot*100):0;
    const vb=div('tb-vote'); place(vb,{x:pad,y:box.h-pad-voteH,w:inner,h:voteH}); vb.style.fontSize=Math.round(voteH*.42)+'px';
    const f=div('fill'); f.style.width=pct+'%'; vb.append(f,el('span','pct',pct+' %'),el('span','cnt',mine===1?i18n('votes1'):i18n('votes',{n:mine}))); c.append(vb);
  }
  if(res&&res.w===side){const rb=el('div','tb-rib',i18n(final?'ribChamp':'ribWin'));rb.style.fontSize=Math.round(Math.min(34,ns*.4))+'px';rb.style.right=pad*1.4+'px';rb.style.top=pad*1.4+'px';c.append(rb);}
  return c;
}
function buildChamp(L,out,br){
  const id=champion(br), e=entryById(id), C=L.champ, c=div('rg tb-champ'); place(c,C);
  const ts=Math.round(C.h*.14), tr=div('tb-trophy'); tr.innerHTML=`<svg width="${ts}" height="${ts}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M8 21h8M12 17v4M7 4h10v5a5 5 0 0 1-10 0V4z"/><path d="M17 5h2.5a1.5 1.5 0 0 1 0 3H17M7 5H4.5a1.5 1.5 0 0 0 0 3H7"/></svg>`;
  const lab=el('div','tb-clab',i18n('champLabel')); lab.style.fontSize=Math.round(C.h*.05)+'px';
  c.append(tr,lab);
  if(e&&e.img){const ih=Math.round(C.h*.38),fr=div('tb-cimg');fr.style.cssText=`width:${Math.round(ih*1.3)}px;height:${ih}px`;const im=new Image();im.src=e.img;im.alt='';fr.append(im);c.append(fr);}
  const nm=div('tb-cname'), nh=Math.round(C.h*(e&&e.img?.16:.26)); nm.style.width=(C.w-80)+'px'; nm.style.height=nh+'px';
  fitInto(nm,e?(e.name.trim()||'?'):'?',C.w-80,nh,Math.round(nh*.85),800,1.05,2); c.append(nm);
  out.push(c);
}

/* ---------- Editor ---------- */
let restartArm=0, clearArm=0, entDirty=false, flashT=0;
function renderTool(){
  renderPanel();
  if(state.flash>Date.now()){clearTimeout(flashT);flashT=setTimeout(refresh,state.flash-Date.now()+60);}
  const br=bracket();
  if(stage.dataset.view==='champ'&&br.R){const fr=state.results[(br.R-1)+'-0'];if(fr&&fr.t!==champShownAt&&Date.now()-fr.t<6000&&curL){champShownAt=fr.t;confettiCv=confettiOn(stage,curL.W,curL.H,4);confettiEnd=performance.now()+4000;}}
}
function renderPanel(){
  if(!$('#btnVote')) return;
  const br=bracket(), key=br.n>=2?displayKey(br):'', res=key?state.results[key]:null, v=state.vote&&state.vote.key===key?state.vote:null;
  const open=!!(v&&v.open);
  $('#btnVote').textContent=open?i18n('voteStop')+(v.until?' · '+fmtLeft(v.until):''):i18n('voteStart');
  $('#btnVote').disabled=!key||!!res; $('#btnVote').classList.toggle('primary',!open);
  const [a,b]=key?slots(br,...parseKey(key)):[null,null];
  const pick=(btn,n,id,side)=>{btn.replaceChildren(el('b',null,n),el('span',null,id?nameOf(id):'—'));btn.disabled=!key;btn.classList.toggle('on',!!res&&res.w===side);};
  pick($('#btnA'),'1',a,0); pick($('#btnB'),'2',b,1);
  $('#btnNext').textContent=i18n('nextMatch'); $('#btnNext').disabled=!key||!res;
  $('#btnUndo').disabled=!state.order.length;
  let st;
  if(br.n<2) st=i18n('stNeed');
  else if(!key) st=i18n('stDone',{n:nameOf(champion(br))});
  else{const [r,m]=parseKey(key);st=i18n('stMatch',{r:roundName(br,r),m:m+1,n:br.S>>(r+1)});const vv=v||(res&&(res.va||res.vb)?{a:res.va,b:res.vb}:null);if(vv) st+=' · '+i18n('stVotes',{n:vv.a+vv.b});}
  $('#tbStatus').textContent=st;
}
function renderToolSidebar(){
  const box=$('#entList'); if(!box) return;
  const ae=document.activeElement; if(ae&&ae.tagName==='INPUT'&&box.contains(ae)){entDirty=true;return;}
  entDirty=false; const L=locked();
  $('#entCount').textContent=state.entries.length+' / '+MAX_ENT;
  box.replaceChildren(...state.entries.map((e,i)=>{
    const row=div('ent'); row.dataset.id=e.id;
    const th=el('button','ent-th'); th.title=i18n('imgPick');
    if(e.img){const im=new Image();im.src=e.img;im.alt='';th.append(im);}else th.textContent='+';
    th.onclick=()=>{pickFor=e.id;$('#imgFile').click();};
    const inp=document.createElement('input'); inp.type='text'; inp.value=e.name; inp.maxLength=60; inp.spellcheck=false;
    inp.oninput=()=>{const en=entryById(e.id);if(en){en.name=inp.value;commit({skipSidebar:true});}};
    inp.onblur=()=>{if(entDirty) setTimeout(renderToolSidebar,0);};
    const x=el('button','small ghost','✕'); x.disabled=L; x.onclick=()=>removeEntry(e.id);
    row.append(el('span','ent-n',String(i+1)),th,inp,x); return row;
  }));
  for(const s of ['#btnShuffle','#btnPaste','#btnClearEnt','#entAdd','#btnImgs']) $(s).disabled=L;
  $('#lockNote').hidden=!L;
}
function structural(){if(locked()){toast(i18n('tLocked'));return false;}state.cur='';state.vote=null;return true;}
function addEntry(name,img){
  name=String(name||'').trim().slice(0,60); if(!name&&!img) return false;
  if(state.entries.length>=MAX_ENT){toast(i18n('tMax'));return false;}
  state.entries.push({id:uid(),name,img:img||''}); return true;
}
function removeEntry(id){if(!structural()) return;state.entries=state.entries.filter(e=>e.id!==id);commit();}
let pickFor='';
async function fileToImg(file){
  const url=URL.createObjectURL(file);
  try{
    const im=await loadImg(url), k=Math.min(1,320/Math.max(im.naturalWidth,im.naturalHeight)), c=document.createElement('canvas');
    c.width=Math.max(1,Math.round(im.naturalWidth*k)); c.height=Math.max(1,Math.round(im.naturalHeight*k)); c.getContext('2d').drawImage(im,0,0,c.width,c.height);
    let d=c.toDataURL('image/webp',.85); if(!d.startsWith('data:image/webp')) d=c.toDataURL('image/jpeg',.85); return d;
  }finally{URL.revokeObjectURL(url);}
}
const nameFromFile=f=>f.name.replace(/\.[^.]+$/,'').replace(/[_]+/g,' ').replace(/\s+/g,' ').trim().slice(0,60)||'?';
async function addFiles(files){
  files=[...files].filter(f=>/^image\//.test(f.type)); if(!files.length) return;
  if(!structural()) return;
  for(const f of files){if(state.entries.length>=MAX_ENT){toast(i18n('tMax'));break;}try{addEntry(nameFromFile(f),await fileToImg(f));}catch(e){}}
  commit();
}
async function setImage(id,file){try{const d=await fileToImg(file),en=entryById(id);if(en){en.img=d;commit();}}catch(e){toast(i18n('tExportFail'));}}
function shuffleEntries(){if(!structural()) return;const E=state.entries;for(let i=E.length-1;i>0;i--){const a=new Uint32Array(1);crypto.getRandomValues(a);const j=a[0]%(i+1);[E[i],E[j]]=[E[j],E[i]];}toast(i18n('tShuffled'));commit();}
function toolKeys(e){
  if(e.ctrlKey||e.metaKey||e.altKey) return false;
  const k=e.key;
  if(k==='1'||k==='ArrowLeft'){e.preventDefault();decide(0);return true;}
  if(k==='2'||k==='ArrowRight'){e.preventDefault();decide(1);return true;}
  if(k==='Enter'){e.preventDefault();next();return true;}
  if(e.code==='Space'){e.preventDefault();toggleVote();return true;}
  if(k==='b'||k==='B'){setView(state.view==='duel'&&!flashActive?'bracket':'duel');return true;}
  if(k==='z'||k==='Z'||k==='Backspace'){e.preventDefault();undo();return true;}
  return false;
}
async function toolExport(f){
  const br=bracket(); if(br.n<2){toast(i18n('tNeed2'));return;}
  try{
    const [W,H]=f==='1:1'?[1080,1080]:f==='9:16'?[1080,1920]:[1920,1080];
    const T=f==='1:1'?{title:{x:60,y:34,w:960,h:76},A:{x:30,y:126,w:1020,h:890}}:f==='9:16'?{title:{x:60,y:50,w:960,h:90},A:{x:30,y:170,w:1020,h:1680}}:{title:{x:200,y:34,w:1520,h:80},A:{x:40,y:140,w:1840,h:880}};
    const c=document.createElement('canvas'); c.width=W; c.height=H; const g=c.getContext('2d'); drawBg(g,W,H);
    const im=await loadImg('data:image/svg+xml;charset=utf-8,'+encodeURIComponent(bracketSVG(br,W,H,T,f!=='9:16',{})));
    g.drawImage(im,0,0,W,H);
    await drawBrand(g,{x:W-420,y:H-50,w:380,h:28});
    const blob=await new Promise(res=>c.toBlob(res,'image/png')); if(!blob) throw new Error('blob');
    downloadBlob(blob,slugify(titleText())+'-'+f.replace(':','x')+'.png'); toast(i18n('tExported',{f}));
  }catch(err){console.warn(err);toast(i18n('tExportFail'));}
}
function toolInit(){
  $('#btnUndo').onclick=undo;
  $('#btnVote').onclick=toggleVote;
  $('#btnA').onclick=()=>decide(0);
  $('#btnB').onclick=()=>decide(1);
  $('#btnNext').onclick=next;
  $('#viewSeg').addEventListener('click',e=>{const b=e.target.closest('button[data-val]');if(b) setView(b.dataset.val);});
  $('#btnRestart').onclick=e=>{
    const b=e.currentTarget;
    if(!restartArm){b.textContent=i18n('restartSure');restartArm=setTimeout(()=>{restartArm=0;b.textContent=i18n('restart');},3000);return;}
    clearTimeout(restartArm);restartArm=0;b.textContent=i18n('restart');restart();toast(i18n('tRestarted'));commit();
  };
  $('#entAdd').addEventListener('keydown',e=>{if(e.key!=='Enter') return;e.preventDefault();if(!structural()) return;if(addEntry(e.target.value)){e.target.value='';commit();}});
  $('#btnImgs').onclick=()=>$('#imgFiles').click();
  $('#imgFiles').onchange=e=>{addFiles(e.target.files);e.target.value='';};
  $('#imgFile').onchange=e=>{const f=e.target.files[0];if(f&&pickFor) setImage(pickFor,f);e.target.value='';};
  $('#btnShuffle').onclick=shuffleEntries;
  $('#btnPaste').onclick=()=>{$('#pasteArea').value='';$('#pasteDlg').showModal();};
  $('#pasteCancel').onclick=()=>$('#pasteDlg').close();
  $('#pasteOk').onclick=()=>{
    if(structural()){for(const l of $('#pasteArea').value.split('\n')){if(!l.trim()) continue;if(!addEntry(l)) break;}commit();}
    $('#pasteDlg').close();
  };
  $('#btnClearEnt').onclick=e=>{
    const b=e.currentTarget;
    if(!clearArm){b.textContent=i18n('clearSure');clearArm=setTimeout(()=>{clearArm=0;b.textContent=i18n('clearAll');},3000);return;}
    clearTimeout(clearArm);clearArm=0;b.textContent=i18n('clearAll');if(structural()){state.entries=[];commit();}
  };
  const card=$('#entCard');
  card.addEventListener('dragover',e=>{if([...e.dataTransfer.types].includes('Files')){e.preventDefault();card.classList.add('tb-drop');}});
  card.addEventListener('dragleave',e=>{if(!card.contains(e.relatedTarget)) card.classList.remove('tb-drop');});
  card.addEventListener('drop',e=>{
    e.preventDefault(); card.classList.remove('tb-drop');
    const files=[...e.dataTransfer.files].filter(f=>/^image\//.test(f.type)), row=e.target.closest('.ent');
    if(row&&files.length===1) setImage(row.dataset.id,files[0]); else addFiles(files);
  });
  stage.addEventListener('click',e=>{
    if(!isOwner()) return;
    const g=e.target.closest('[data-k]');
    if(g){state.cur=g.getAttribute('data-k');state.view='duel';state.flash=0;commit();return;}
    const c=e.target.closest('.tb-card'); if(c) decide(+c.dataset.side);
  });
  setInterval(()=>{
    const v=state.vote;
    if(v&&v.open&&v.until){
      if(Date.now()>=v.until&&isOwner()){closeVote();return;}
      const cd=$('.tb-cta .cd',stage); if(cd) cd.textContent=fmtLeft(v.until);
      const bv=$('#btnVote'); if(bv) bv.textContent=i18n('voteStop')+' · '+fmtLeft(v.until);
    }
  },250);
}

coreStart();
})();
